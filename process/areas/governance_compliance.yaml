# Process area: Governance & Compliance (G&C)  - tier: qorix
# Technology-neutral process content. Rendered to RST by `qpm render-process`.
area:
  id: governance_compliance
  title: Governance & Compliance
  tier: qorix
  owner: rl__qx_gc_head
  purpose: >
    Own the Qorix process framework: maintain the Qorix overlay on top of Eclipse SCORE,
    approve project tailoring, run compliance audits, and feed improvements back to SCORE
    through the Qorix Fork.
  standards: [ISO 26262-2, ISO/SAE 21434 cl. 5-6, ASPICE 4.0 PIM.3 / SUP.1 / MAN.3]

concepts:
  - id: doc_concept__qx_gc_process
    title: Qorix Process Tiering Concept
    body: |
      Three tiers compose every project's process: (1) the Eclipse SCORE baseline,
      imported unchanged; (2) the Qorix overlay, which may only add or widen
      (superset rule); (3) the project tailoring, which may only narrow and must
      justify each narrowing. The resolved model is generated, never hand-edited.

roles:
  - id: rl__qx_gc_head
    title: Head of Governance & Compliance
    description: Accountable for the Qorix process framework, approves overlay changes, tailorings and audit reports.
  - id: rl__qx_process_owner
    title: Process Owner
    description: Maintains one or more Qorix process areas and their metamodel operations.
  - id: rl__qx_compliance_auditor
    title: Compliance Auditor
    description: Independent of the audited project; plans and performs process and work-product audits.

templates:
  - id: gd_temp__qx_project_tailoring
    title: Project Tailoring Template
    file: projects/_template/tailoring.qpm.yaml
  - id: gd_temp__qx_audit_report
    title: Compliance Audit Report Template
    file: templates/audit_report.md
  - id: gd_temp__qx_upstream_proposal
    title: SCORE Upstream Proposal Template
    file: templates/upstream_proposal.md

workproducts:
  - id: wp__qx_process_overlay
    title: Qorix Process Overlay
    purpose: >
      The versioned Qorix tier (model/tiers/10_qorix) and the Qorix process areas: the
      organisation-specific rules and processes on top of SCORE.
    concept: doc_concept__qx_gc_process
    complies: [std_wp__iso26262__management_551, std_wp__isosae21434__org_management_551, std_req__aspice_40__iic-10-00]
  - id: wp__qx_project_tailoring
    title: Project Tailoring Record
    purpose: >
      projects/<id>/tailoring.qpm.yaml plus the generated tailoring report: integrity ceilings
      (ASIL, CAL, ASPICE level) and every narrowing with its rationale.
    concept: doc_concept__qx_gc_process
    template: gd_temp__qx_project_tailoring
    complies: [std_req__aspice_40__iic-15-54]
  - id: wp__qx_audit_report
    title: Compliance Audit Report
    purpose: Result of a process / work-product audit, with findings recorded as gc_finding needs.
    concept: doc_concept__qx_gc_process
    template: gd_temp__qx_audit_report
    complies: [std_req__aspice_40__iic-15-13, std_wp__isosae21434__org_management_555]
  - id: wp__qx_upstream_proposal
    title: SCORE Upstream Proposal
    purpose: >
      Generated by `qpm export-upstream`: overlay operations flagged `upstream: candidate`,
      rendered as a SCORE metamodel diff and PR description for the Qorix Fork.
    concept: doc_concept__qx_gc_process
    template: gd_temp__qx_upstream_proposal

workflows:
  - id: wf__qx_gc_maintain_overlay
    title: Maintain Qorix process overlay
    responsible: rl__qx_process_owner
    approved_by: rl__qx_gc_head
    supported_by: [rl__safety_manager, rl__security_manager, rl__quality_manager, rl__qx_infra_engineer]
    input: [wp__process_description, wp__policies, wp__process_impr_report]
    output: [wp__qx_process_overlay]
    has: [doc_concept__qx_gc_process]
    activities:
      - {step: "Raise a change request against the framework repo (new op, new area, SCORE upgrade)", by: rl__qx_process_owner}
      - {step: "On SCORE upgrade: run `qpm import-score`, review the base-tier diff", by: rl__qx_process_owner}
      - {step: "Edit operations in the Qorix tier; flag each `upstream: candidate | qorix_only`", by: rl__qx_process_owner}
      - {step: "CI composes all projects; any project that no longer composes blocks the merge", by: rl__qx_infra_engineer}
      - {step: "Review safety / security / quality impact", by: rl__safety_manager}
      - {step: "Approve and tag a framework release", by: rl__qx_gc_head}
  - id: wf__qx_gc_tailor_project
    title: Tailor process for a project
    responsible: rl__project_lead
    approved_by: rl__qx_gc_head
    supported_by: [rl__safety_manager, rl__security_manager]
    input: [wp__qx_process_overlay, wp__feat_request]
    output: [wp__qx_project_tailoring, wp__safety_tailoring]
    contains: [gd_temp__qx_project_tailoring]
    has: [doc_concept__qx_gc_process]
    activities:
      - {step: "Copy projects/_template and set ASIL / CAL / ASPICE ceilings and process areas", by: rl__project_lead}
      - {step: "Add narrowing operations with a rationale each", by: rl__project_lead}
      - {step: "`qpm compose` must pass; generated tailoring report is reviewed", by: rl__safety_manager}
      - {step: "Approve the tailoring (merge to main)", by: rl__qx_gc_head}
  - id: wf__qx_gc_compliance_audit
    title: Plan and perform compliance audit
    responsible: rl__qx_compliance_auditor
    approved_by: rl__qx_gc_head
    supported_by: [rl__project_lead, rl__quality_manager]
    input: [wp__qx_project_tailoring, wp__qms_plan, wp__module_safety_plan]
    output: [wp__qx_audit_report]
    contains: [gd_temp__qx_audit_report]
    activities:
      - {step: "Select scope from the tailoring record (areas, integrity levels)", by: rl__qx_compliance_auditor}
      - {step: "Run `qpm lint-needs` on the project needs.json for objective evidence", by: rl__qx_compliance_auditor}
      - {step: "Interview and sample work products", by: rl__qx_compliance_auditor}
      - {step: "Record each finding as a gc_finding need linked (affects) to the item", by: rl__qx_compliance_auditor}
      - {step: "Approve the audit report", by: rl__qx_gc_head}
  - id: wf__qx_gc_upstream_contribution
    title: Contribute process improvements to SCORE (Qorix Fork)
    responsible: rl__qx_process_owner
    approved_by: rl__qx_gc_head
    supported_by: [rl__process_community]
    input: [wp__qx_process_overlay]
    output: [wp__qx_upstream_proposal]
    contains: [gd_temp__qx_upstream_proposal]
    activities:
      - {step: "Run `qpm export-upstream` to produce the SCORE metamodel diff", by: rl__qx_process_owner}
      - {step: "Push to the Qorix Fork of SCORE and open a PR", by: rl__qx_process_owner}
      - {step: "Discuss in the SCORE process community", by: rl__process_community}
      - {step: "After SCORE merges: re-import base, remove the now-redundant overlay op", by: rl__qx_process_owner}