# Governance & Compliance (compliance/governance_compliance)  -  roles.
roles:
- id: rl_qx_gc_head
  title: Head of Governance & Compliance
  description: Accountable for the Qorix process framework, approves overlay changes, tailorings and audit
    reports.
- id: rl_qx_gc_process_owner
  title: Process Owner
  description: Maintains one or more Qorix process areas and their metamodel operations.
- id: rl_qx_gc_compliance_auditor
  title: Compliance Auditor
  description: Independent of the audited project; plans and performs process and work-product audits.
- id: rl_qx_gc_project_lead
  title: Project Lead
  description: Leads a project; owns its tailoring and its plans.
