# Cybersecurity Continual Activities (compliance/security/csms_continual)  -  work products.
work_products:
- id: wp_qx_cscont_sources_for_cs_info
  title: Sources for Cybersecurity Information
  kind: record
  status: draft
  purpose: Register of sources selected for collection of cybersecurity information (central monitoring
    team, customer monitoring team, researchers, commercial / non-commercial organizations, item definition,
    TARA, cybersecurity claims, cybersecurity specifications, past vulnerability analysis, field information),
    with issuing organization, responsible collector, and keywords per source.
  concept: doc_concept_qx_cscont_process
  template: gd_temp_qx_cscont_cs_monitoring_and
  complies:
  - std_wp_isosae21434_continual_8331
- id: wp_qx_cscont_triggers_for_cs_info_triage
  title: Triggers for Cybersecurity Information Triage
  kind: record
  status: draft
  purpose: Register of triggers (keywords, patterns, thresholds) used to triage collected cybersecurity
    information, maintained against the same documentation basis as Sources for Cybersecurity Information.
  concept: doc_concept_qx_cscont_process
  complies:
  - std_wp_isosae21434_continual_8332
- id: wp_qx_cscont_cs_events
  title: Cybersecurity Events
  kind: record
  status: draft
  purpose: Log of cybersecurity information triaged as one or more cybersecurity events, each traceable
    to the triggering source and trigger.
  concept: doc_concept_qx_cscont_process
  complies:
  - std_wp_isosae21434_continual_8333
- id: wp_qx_cscont_weaknesses_from_cs_events
  title: Weaknesses from Cybersecurity Events
  kind: record
  status: draft
  purpose: Weaknesses identified from evaluation of cybersecurity events, each traceable to the originating
    event and to the affected item / component element.
  concept: doc_concept_qx_cscont_process
  complies:
  - std_wp_isosae21434_continual_8431
- id: wp_qx_cscont_vulnerability_analysis
  title: Vulnerability Analysis
  kind: analysis
  status: draft
  purpose: 'Per-weakness vulnerability analysis: exploitability determination, CVSS-based attack feasibility
    rating, related assets and impacts, attack path, and, where a weakness is not identified as a vulnerability,
    the supporting rationale.'
  concept: doc_concept_qx_cscont_process
  template: gd_temp_qx_cscont_cs_monitoring_and
  complies:
  - std_wp_isosae21434_continual_8531
- id: wp_qx_cscont_vulnerability_report
  title: Vulnerability Report
  kind: report
  status: draft
  purpose: Consolidated register of identified vulnerabilities and their risk ranking, risk treatment
    decision, treatment status, and closure evidence, maintained until the end of cybersecurity support
    of the item or component. Consolidates weaknesses found during development (Weaknesses Found During
    Product Development), fuzz testing (Vulnerability Analysis Report), and penetration testing (Penetration
    Test Report (Internal / External)) alongside vulnerabilities identified through continual monitoring.
  concept: doc_concept_qx_cscont_process
  complies:
  - std_wp_isosae21434_continual_8631
