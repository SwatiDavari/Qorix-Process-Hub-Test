# Cybersecurity Continual Activities (compliance/security/csms_continual)  -  templates and guidance.
templates:
- id: gd_chklst_qx_cscont_cs_continual_activities
  title: Cybersecurity Continual Activities Review Checklist
  status: draft
  description: Cybersecurity Continual Activities Review Checklist
- id: gd_guidl_qx_cscont_cs_continual_activities
  title: Cybersecurity Continual Activities
  status: draft
  description: Cybersecurity Continual Activities
- id: gd_req_qx_cscont_sources_for_cs_info
  title: Sources for cybersecurity information
  status: draft
  description: Sources shall be selected for collection of cybersecurity information and recorded in Sources
    for Cybersecurity Information.
- id: gd_req_qx_cscont_triggers_for_triage_of_cs
  title: Triggers for triage of cybersecurity information
  status: draft
  description: Triggers shall be defined and maintained for the triage of cybersecurity information and
    recorded in Triggers for Cybersecurity Information Triage.
- id: gd_req_qx_cscont_collection_and_triage_of_cs
  title: Collection and triage of cybersecurity information
  status: draft
  description: Cybersecurity information shall be collected and triaged against the defined triggers to
    determine whether it becomes one or more cybersecurity events, recorded in Cybersecurity Events.
- id: gd_req_qx_cscont_evaluation_of_cs_events_for
  title: Evaluation of cybersecurity events for weaknesses
  status: draft
  description: A cybersecurity event shall be evaluated to identify weaknesses in the item or component,
    recorded in Weaknesses from Cybersecurity Events.
- id: gd_req_qx_cscont_analysis_of_weaknesses_for
  title: Analysis of weaknesses for vulnerabilities
  status: draft
  description: Weaknesses shall be analyzed to identify vulnerabilities, using the CVSS-based attack feasibility
    method of CVSS-Based Vulnerability Analysis and Management, recorded in Vulnerability Analysis.
- id: gd_req_qx_cscont_rationale_for_a_weakness
  title: Rationale for a weakness not identified as a vulnerability
  status: draft
  description: A rationale shall be provided and recorded in Vulnerability Analysis for a weakness that
    is not identified as a vulnerability.
- id: gd_req_qx_cscont_mgmt_of_identified_vuln
  title: Management of identified vulnerabilities
  status: draft
  description: Identified vulnerabilities shall be managed, including risk ranking and risk treatment
    decision, recorded in Vulnerability Report.
- id: gd_req_qx_cscont_vulnerability_tracking
  title: Vulnerability tracking until end of cybersecurity support
  status: draft
  description: A managed vulnerability shall remain tracked in Vulnerability Report, with treatment status
    and closure evidence maintained, until the end of cybersecurity support of the item or component.
- id: gd_temp_qx_cscont_cs_monitoring_and
  title: CS Monitoring and Vulnerability Management Template
  status: draft
  description: CS Monitoring and Vulnerability Management Template
- id: gd_guidl_qx_cscont_cs_monitoring_and
  title: CS Monitoring and Vulnerability Management Template Guideline
  status: draft
  description: CS Monitoring and Vulnerability Management Template Guideline
- id: gd_guidl_qx_cscont_cvss_based_vulnerability
  title: CVSS-Based Vulnerability Analysis and Management
  status: draft
  description: CVSS-Based Vulnerability Analysis and Management
