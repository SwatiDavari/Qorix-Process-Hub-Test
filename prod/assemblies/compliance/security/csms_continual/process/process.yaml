getting_started: '**Purpose**


  The Cybersecurity Continual Activities is a process that collects cybersecurity information, evaluates
  it for weaknesses, analyzes weaknesses for exploitable vulnerabilities, and manages identified vulnerabilities
  through to closure. It runs for the full lifecycle of an item or component, independent of any single
  product release.


  This process directly implements ISO/SAE 21434 Clause 8 (Continual Cybersecurity Activities) and provides
  the vulnerability intelligence that keeps the Threat Analysis and Risk Assessment (Clause 15), cybersecurity
  development (Clause 10), and incident response (Clause 13) up-to-date.


  **Organizational Scope and Applicability**


  This process applies to:


  - All products and projects that have released, or are preparing to release, an item or component subject
  to the organization''s Cybersecurity Management System.

  - Every phase of the lifecycle in which cybersecurity information can be received: concept, development,
  operation, and until the end of cybersecurity support of the item or component.


  An org-level Cybersecurity Monitoring Centre team performs the activities described here. The products
  / projects subscribe to it. See for the organizational model.


  **Lifecycle Relevance**


  Cybersecurity monitoring, event evaluation, vulnerability analysis, and vulnerability management operate
  continuously, in parallel with product-specific lifecycle activities. The output of this process feeds:


  - Threat Analysis and Risk Assessment (Clause 15), when a new vulnerability revises an assumption used
  in an existing threat scenario or attack path.

  - Cybersecurity Concept phase (Clause 9): a reduce risk treatment decision is checked top-down against
  cybersecurity goals (CS Goals) and cybersecurity concept (Cybersecurity Concept) — updating whichever
  actually changes as a result of the mitigation. A retain or share/transfer decision updates cybersecurity
  claims (CS Claims) with the accepted residual risk and its rationale instead.

  - Cybersecurity development (Clause 10): cybersecurity specifications (Cybersecurity Specifications)
  are updated to implement whatever changed above. Only where neither goals nor concept change — the mitigation
  is a specification-level requirement addition alone — is this update made on its own; that determination
  must be stated explicitly, not assumed.

  - Cybersecurity incident response (Clause 13), when a vulnerability is confirmed to be exploited in
  the field.

  - Change management, when treatment of a vulnerability requires a change to a released item or component.


  See Step 6 of CVSS-Based Vulnerability Analysis and Management for the full treatment-to-work-product
  mapping.


  **Preconditions and Dependencies**


  Typical preconditions include:


  - A baselined item / component definition (CS Item / Component Definition).

  - Baselined cybersecurity goals (CS Goals)

  - Baselined cybersecurity claims (CS Claims).

  - Baselined cybersecurity concept (Cybersecurity Concept).

  - Baselined cybersecurity specifications (Cybersecurity Specifications).

  - An established Cybersecurity Monitoring Centre team and its subscription agreement with the requesting
  product / project.

  - For ongoing monitoring (once Plan and Prepare Cybersecurity Monitoring has established sources and
  triggers): a deployed collection and triage capability — a Cybersecurity Information Monitoring Dashboard,
  scoped to the registered sources (Sources for Cybersecurity Information) and triggers (Triggers for
  Cybersecurity Information Triage), that feeds matches into the issue tracking system — or an equivalent
  triage arrangement.


  **General Workflow**


  Six activities are performed, each producing a reviewed work product:


  - Plan and Prepare Cybersecurity Monitoring,

  - Collect and Triage Cybersecurity Information,

  - Evaluate Cybersecurity Events for Weaknesses,

  - Perform Vulnerability Analysis,

  - Manage Identified Vulnerabilities, and

  - Validate and Close Vulnerability.


  Guidance for each step is provided by Cybersecurity Continual Activities and CVSS-Based Vulnerability
  Analysis and Management.


  **Governance and Compliance Context**


  This process:


  - Fulfills ISO/SAE 21434 Clause 8 requirements RQ-08-01 through RQ-08-08.

  - Provides evidence of an operating vulnerability handling capability expected under UNECE R155 Annex
  5 and typical OEM / Tier 1 Cybersecurity Interface Agreement (CIA) clauses for a Tier 2 supplier.

  - Reuses the CVSS-based attack feasibility method of ISO/SAE 21434 Annex G.3 and the attack path / risk
  ranking / risk treatment methods of Clause 15 (see CVSS-Based Vulnerability Analysis and Management).


  **Tailoring Information**


  - The Cybersecurity Monitoring Centre lead function is realized by Cybersecurity Monitoring Team, the
  same Cybersecurity Incident Response / Monitoring Team defined in Cybersecurity Operations and Maintenance;
  in a smaller organization this may be the same individuals as Engineer, provided responsibilities and
  independence of review remain distinguishable in the product / project cybersecurity plan.

  - The depth of source coverage and triage automation may be tailored to the CAL of the cybersecurity
  goals realized by the monitored item or component.


  **Tooling Support**


  - Cybersecurity Information Monitoring Dashboard.: It queries the registered sources (Sources for Cybersecurity
  Information), applies the registered triggers (Triggers for Cybersecurity Information Triage), and runs
  at the periodicity agreed per source in the collection plan. Scope is limited to information relevant
  to this organization''s items / components — it is not a general log or network telemetry tool.

  - Issue tracking system. Every dashboard match is logged here as a cybersecurity event. This is the
  sole system of record for the per-vulnerability register and its workflow states, through to closure.


  See CS Monitoring and Vulnerability Management Template for the tool-neutral fill-in structure.'
concepts:
- id: doc_concept_qx_cscont_process
  title: Cybersecurity Continual Activities Concept
  body: '**Motivation**


    An item or component accumulates new cybersecurity information for as long as it is supported: newly
    disclosed weaknesses in reused / open-source components, researcher or vendor advisories, field incidents,
    and results from cybersecurity verification and validation testing. ISO/SAE 21434 Clause 8 requires
    that this information be collected, evaluated for weaknesses, analyzed for exploitability, and that
    identified vulnerabilities be tracked until treatment is complete. This concept describes how that
    continual, organization-level capability is structured so that individual products / projects are
    not each required to build and staff it independently.


    **Organizational Model**


    A Cybersecurity Monitoring Centre team is established and maintained, independent of any one product
    / project, to perform cybersecurity monitoring, triage, and initial evaluation on behalf of subscribing
    products / projects.


    Each subscribing product / project retains ownership of the decisions that require item / component-specific
    context (whether a weakness is exploitable, the risk treatment decision, and closure), performed by
    Engineer and Cybersecurity Product Owner, while the centre team (Cybersecurity Monitoring Team) provides
    shared collection details, sources, and first-pass triage.


    **Approach**


    The concept models Clause 8 as a five-stage information pipeline, each stage consuming the previous
    stage''s work product and producing its own:


    1. Plan and prepare (Plan and Prepare Cybersecurity Monitoring): Sources of cybersecurity information
    are selected and triggers for triage are defined, based on the item / component definition, cybersecurity
    claims, cybersecurity specifications, threat scenarios, past vulnerability analysis, and field information.
    2. Monitor (Collect and Triage Cybersecurity Information): Information from the selected sources is
    collected continuously and triaged against the defined triggers to determine whether it constitutes
    one or more cybersecurity events. 3. Evaluate (Evaluate Cybersecurity Events for Weaknesses): Each
    cybersecurity event is assessed to determine whether it represents a weakness in the item or component.


    .. figure:: _assets/cs_cont_event_evaluation_logic.png :align: center :alt: Decision logic used to
    confirm whether reported cybersecurity information is a weakness for the integrated component :name:
    cs_cont_event_evaluation_logic


    Event evaluation decision logic: a reported issue is confirmed against the actually integrated component
    and configuration before it is dismissed as not applicable.


    4. Analyze (Perform Vulnerability Analysis): Each weakness is analyzed against the item / component
    definition and cybersecurity specifications to determine whether it is exploitable (a vulnerability),
    using the CVSS-based attack feasibility method of CVSS-Based Vulnerability Analysis and Management.
    5. Manage and close (Manage Identified Vulnerabilities, Validate and Close Vulnerability): Every identified
    vulnerability is risk-ranked, a risk treatment decision is made and tracked, and the vulnerability
    is validated and closed once treated.


    **Vulnerability / Risk Relationship**


    This relationship has two consequences for the process.


    First, vulnerability analysis (step 4) is scoped to the item / component definition and cybersecurity
    specifications. It is never performed in isolation from them.


    Second, vulnerability management (step 5) is more than a tracker status change. The risk treatment
    decision is checked top-down against the work products it may affect:


    - Reduce: checked top-down — cybersecurity goals (CS Goals) update first if the mitigation changes
    what must be true; cybersecurity concept (Cybersecurity Concept) updates next if concept-level controls
    or requirements change; cybersecurity specifications (Cybersecurity Specifications) implement whatever
    changed above. Only where neither goals nor concept change — the mitigation is a specification-level
    requirement addition alone — is Cybersecurity Specifications updated by itself, and that determination
    is stated explicitly, never assumed.

    - Retain or share/transfer: cybersecurity claims (CS Claims), recording the accepted residual risk
    and its rationale. Only where the decision invalidates an existing goal or requires a new one: cybersecurity
    goals (CS Goals) as well — the exception, not the default.


    A Change Request is raised on top of this, where treatment requires a change to a released item or
    component. See Step 6 of CVSS-Based Vulnerability Analysis and Management for the full mapping.


    **Relationship to Other Processes**


    Cybersecurity Continual Activities does not duplicate the weakness-detection methods performed elsewhere
    in the lifecycle; it consumes their findings as additional cybersecurity information sources and consolidates
    them:


    - Cybersecurity Development (Clause 10): Manual source code review, static and dynamic code analysis,
    CWE classification, SBOM, and FOSS license / known-CVE screening performed during implementation feed
    weaknesses found during development (Weaknesses Found During Product Development) into Weaknesses
    from Cybersecurity Events / Vulnerability Report.

    - Cybersecurity Verification (Clause 10 verification activities): Fuzz testing (Perform Fuzz Testing)
    reports anomalous responses in Vulnerability Analysis Report, treated as a cybersecurity information
    source under Collect and Triage Cybersecurity Information.

    - Cybersecurity Validation (Clause 11): Penetration testing (Execute Validation and Penetration Testing)
    reports findings in Penetration Test Report (Internal / External), likewise treated as a cybersecurity
    information source.

    - TARA (Clause 15): Item definition, threat scenarios, and attack paths are consumed as inputs to
    vulnerability analysis; a confirmed vulnerability is fed back to TARA where it revises an existing
    threat scenario or attack path assumption (see TARA Record).

    - Cybersecurity Incident Response (Clause 13, realized as part of Cybersecurity Operations and Maintenance):
    a confirmed vulnerability, or a weakness exploited in the field, is handed from Manage Identified
    Vulnerabilities to Detect, Log and Triage Cybersecurity Incident for incident classification and response
    planning; conversely, a systemic weakness identified during Conduct Post-Incident Review is fed back
    as a cybersecurity information source into Collect and Triage Cybersecurity Information.


    **CVSS-Based Attack Feasibility (Annex G.3)**


    Vulnerability analysis rates attack feasibility using the CVSS-based approach of ISO/SAE 21434 Annex
    G.3, distinct from the attack-potential-based approach used in TARA (Clause 15.7). Both feed the same
    risk ranking and risk treatment decision methods (Clause 15.8, 15.9), reused unchanged by Manage Identified
    Vulnerabilities. See CVSS-Based Vulnerability Analysis and Management for the full rationale and worked
    method.


    **ASPICE Alignment**


    This process supports:


    - MAN.7 outcomes, by continuously re-assessing risk against operational environment.

    - SUP.9 (Problem Resolution Management) and SUP.10 (Change Request Management) outcomes, where vulnerability
    treatment results in a Change Request.


    **Tailoring Information**


    - Concept depth may be reduced for a component developed out-of-context, where the operational environment
    is assumed rather than known in detail; sources and triggers are then defined against the assumed
    context and revisited once the actual integration context is known.

    - The frequency and automation of monitoring may be tailored to the CAL of the cybersecurity goals
    realized by the item / component.'
