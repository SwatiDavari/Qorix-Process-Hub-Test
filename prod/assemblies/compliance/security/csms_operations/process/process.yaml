getting_started: '**Purpose**


  The purpose of the Cybersecurity Operations and Maintenance process is to restore normal item / component
  operation as quickly as possible when a cybersecurity incident occurs in the field, to minimize the
  impact on operations and stakeholders, and to ensure that updates made to the item / component fixes
  recorded incidents and also do not introduce new vulnerabilities.


  This process ensures that:


  - An incident response / cybersecurity monitoring team, monitoring systems, communication channels,
  and backup and recovery capability are established (Prepare Cybersecurity Incident Management).

  - Every cybersecurity incident is logged, triaged, and assigned a response timeline based on severity
  (Detect, Log and Triage Cybersecurity Incident).

  - A cybersecurity incident response plan is created for each incident, is implemented through containment,
  eradication, and recovery (as applicable), and is closed only once the incident is confirmed resolved
  (Prepare Cybersecurity Incident Response Plan through Validate and Close Cybersecurity Incident).

  - Updates and update-related capabilities are developed in accordance with ISO/SAE 21434 (Perform Cybersecurity
  Update).


  This process directly supports compliance with ISO/SAE 21434 Clause 13 (Cybersecurity Operations and
  Maintenance).


  **Organizational Scope and Applicability**


  This process applies to every item / component that has passed release and entered the operation and
  maintenance phase, for the duration of its cybersecurity support period.


  **Lifecycle Relevance**


  Cybersecurity operations and maintenance begins after item / component release and continues until end
  of cybersecurity support. It is triggered either by a cybersecurity incident reported from the field
  or by a change request for an update, and it interfaces with the change management procedure whenever
  a software update is required to eradicate an incident''s root cause or to deliver an update.


  **Preconditions and Dependencies**


  Typical preconditions include:


  - Cybersecurity information related to the vulnerability that caused the incident, where available.

  - Vulnerability analysis from continual cybersecurity activities (WP-08-05).


  - Release for post-development report (WP-06-04), as a precondition for Perform Cybersecurity Update.


  - The organizational change management and configuration management procedure, used whenever eradication
  or an update requires a software change. Change requests are tracked in Product / Project Management
  and Issue Tracking Platform (e.g., JIRA) and configuration items in hosting platform (e.g., GitHub).


  **Governance and Compliance Context**


  This process:


  - Fulfills ISO/SAE 21434 Clause 13 requirements (RQ-13-01, RQ-13-02, RQ-13-03).

  - Produces the mandatory incident management master plan and cybersecurity incident response plan (WP-13-01)
  supporting closure of each cybersecurity incident.


  **General Workflow**


  **Tooling Support**


  Incident logging, tracking, and closure verification are supported by an incident tracking system (e.g.
  JIRA). The specific tooling is confirmed as part of the incident management master plan (Incident Management
  Master Plan).'
concepts:
- id: doc_concept_qx_csops_process
  title: Cybersecurity Operations and Maintenance Concept
  body: '**Motivation**


    Cybersecurity incidents can occur in the field after item / component release, due to vulnerability
    exploitation, unexpected behavior, or a newly discovered weakness. Clause 13 of ISO/SAE 21434 requires
    a defined process for detecting, containing, eradicating, and recovering from such incidents, and
    for executing updates to the item / component without introducing new vulnerabilities. This process
    area defines how cybersecurity incident response shall be performed and update management is handled
    during operation and maintenance.


    **Inputs**


    The process considers,


    - ISO/SAE 21434 Clause 13.3 (Cybersecurity incident response) and

    - Clause 13.4 (Updates).


    It also considers


    - Vulnerability analysis work product from continual cybersecurity activities (WP-08-05) and

    - Release for post-development report (WP-06-04).


    **Approach**


    The process area is organized around two clauses viz


    - Clause 13.3 is realized as sequence of steps (as per applicability), from preparation of the incident
    management master plan through detection, response planning, containment, eradication, recovery, closure,
    and post-incident review.

    - Clause 13.4 is realized as a single workflow governing updates to the item / component.


    Two work products are maintained: the incident management master plan, prepared once per Prepare Cybersecurity
    Incident Management, and the cybersecurity incident response plan, created for each incident per Prepare
    Cybersecurity Incident Response Plan and closed per Validate and Close Cybersecurity Incident.'
