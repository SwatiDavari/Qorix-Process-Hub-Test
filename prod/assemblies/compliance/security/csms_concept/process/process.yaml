getting_started: '**Purpose**


  The purpose of the Cybersecurity Concept process is to define cybersecurity controls and derive cybersecurity
  requirements that achieve the cybersecurity goals and claims established for the item / component, and
  to allocate those requirements to modules of the item / component. This process ensures that:


  - Cybersecurity controls and their interactions to achieve the cybersecurity goals are described.

  - Cybersecurity requirements of the item / component and its operational environment are defined.

  - The cybersecurity concept is verified for completeness, correctness, and consistency with the cybersecurity
  goals and claims.


  This process directly supports compliance with ISO/SAE 21434 Clause 9.5 and provides mandatory input
  to cybersecurity product development (Clause 10).


  **Organizational Scope and Applicability**


  This process applies to every item or component for which cybersecurity goals and cybersecurity claims
  have been established, regardless of whether the item is developed in full context or out-of-context.


  **Lifecycle Relevance**


  The cybersecurity concept follows cybersecurity goals and claims and precedes:


  - Cybersecurity product development (ISO/SAE 21434 Clause 10)


  The concept is refined whenever cybersecurity goals, claims, or the item definition change.


  **Preconditions and Dependencies**


  Typical preconditions include:


  - Baselined item definition (CS Item / Component Definition)

  - Baselined cybersecurity goals (CS Goals)

  - Baselined cybersecurity claims (CS Claims)

  - TARA, for further supporting context on threat scenarios and controls


  **Governance and Compliance Context**


  This process:


  - Fulfills ISO/SAE 21434 Clause 9.5 requirements (RQ-09-08 through RQ-09-11).

  - Consumes cybersecurity goals and claims (Clause 9.4) and item definition (Clause 9.3).

  - Provides mandatory input to cybersecurity product development (Clause 10).'
concepts:
- id: doc_concept_qx_cscon_process
  title: Cybersecurity Concept Concept
  body: '**Motivation**


    Cybersecurity goals and claims state what must be protected and why; the cybersecurity concept states
    how it is protected. It selects cybersecurity controls, derives cybersecurity requirements from those
    controls, and allocates the requirements to modules of the item / component. Without this step, cybersecurity
    goals remain abstract and cannot be designed, implemented, or verified in Clause 10.


    Inputs considered for Cybersecurity concept include


    - ISO/SAE 21434 Clause 9.5 (Cybersecurity Concept).

    - Cybersecurity goals and claims produced under Clause 9.4

    - Item/component definition (Clause 9.3), and

    - TARA (Clause 15).


    **Input Artifacts**


    - Item / Component definition (CS Item / Component Definition)

    - Cybersecurity goals (CS Goals)

    - Cybersecurity claims (CS Claims)

    - TARA, for threat scenario context and candidate controls

    - Stakeholder / client requirements (functional, technical, performance, process, and non-product/operational
    environment requirements)

    - Consortium requirements (for development following out-of-context approach)


    **Approach**


    Cybersecurity Controls


    A cybersecurity control is a measure selected to mitigate a risk by meeting one or more cybersecurity
    goals. Controls are selected based on stakeholder / consortium requirements, operational environment
    conditions, and the security features of the platform chosen for the item / component. Controls fall
    into two categories:


    - Technical controls: implemented in the system itself (e.g. secure boot, authentication, encryption,
    intrusion detection).

    - Operational controls: applied during the item lifecycle (e.g. secure configuration management, patching,
    security audits).


    For each candidate control - effectiveness, feasibility, and attack-vector coverage are considered
    before selection.


    Cybersecurity Requirements


    Cybersecurity requirements are derived from the selected controls and mechanisms, considering and
    including stakeholder / consortium requirements, so that the gap between cybersecurity goals and technical
    implementation is bridged. Requirements shall be:


    - Specific: unambiguous and detailed enough to implement and verify; written with "shall", not "should"
    or "consider".

    - Testable: verifiable by test, analysis, or demonstration.

    - Complete: covering every cybersecurity goal and the controls selected for it.

    - Consistent: free of contradictions with each other and with stakeholder / consortium requirements.

    - Traceable: linked back to the originating cybersecurity goal, control, and TARA threat scenario.


    Typical flow for Cybersecurity Concept process as below.


    Allocation and CAL Inheritance


    Cybersecurity requirements are allocated to the modules of the item / component, based on the high-level
    architecture. Each requirement inherits the Cybersecurity Assurance Level (CAL) of the cybersecurity
    goal it realizes; where a requirement realizes more than one goal, it inherits the highest CAL among
    them.


    Traceability


    Bidirectional traceability is established between cybersecurity requirements and cybersecurity goals:


    - Forward: every cybersecurity goal has one or more cybersecurity requirements addressing it.

    - Backward: every cybersecurity requirement traces to a cybersecurity goal.


    Any cybersecurity goal without a corresponding requirement is flagged and resolved before baseline.


    Verification


    A verification confirms completeness, correctness, and consistency of the cybersecurity concept and
    the high-level requirement derivation process, and confirms consistency with respect to cybersecurity
    claims. It is recorded in Verification Report for Cybersecurity Concept.


    **ASPICE Alignment**


    This process supports:


    - SEC.1 outcomes by producing cybersecurity requirements as the technical basis for cybersecurity
    solution design.

    - SEC.2 outcomes by providing the cybersecurity architecture inputs (controls and allocation) consumed
    during cybersecurity design.


    **Tailoring Information**


    Concept depth may vary depending on:


    - Whether the item/component is developed out of context.

    - The number and diversity of cybersecurity controls candidate for the platform.

    - The maturity of the operational environment (e.g. availability of hardware security features).'
