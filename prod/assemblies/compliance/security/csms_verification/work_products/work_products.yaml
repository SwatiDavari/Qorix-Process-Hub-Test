  title: Integration and Verification Specification
  kind: requirement
  status: draft
  purpose: Risk treatment verification strategy and the derived test cases for software (and, where applicable,
    system) integration verification, covering dataflow, timing, interface, and resource-consumption criteria
    between components.
  concept: doc_concept_qx_csver_process
  template: gd_temp_qx_csver_cs_integration_and_ver_spec
  complies:
  - std_wp_isosae21434_development_1056
- id: wp_qx_csver_ver_report_for_the_refined_specs
  title: Verification Report for the Refined Specifications
  kind: report
  status: draft
  purpose: Record of the integration verification activities performed against Integration and Verification
    Specification, including test coverage evaluation against defined coverage metrics and the selected
    test cases and results.
  concept: doc_concept_qx_csver_process
  complies:
  - std_wp_isosae21434_development_1054
- id: wp_qx_csver_vulnerability_analysis_report
  title: Vulnerability Analysis Report
  kind: report
  status: draft
  purpose: List of anomalous responses identified during fuzz testing (mutated inputs that are neither
    valid nor expected-negative), together with the positive test suite log used as the nominal-behavior
    baseline.
  concept: doc_concept_qx_csver_process
  complies:
  - std_wp_isosae21434_development_1055
- id: wp_qx_csver_integration_and_ver_report
  title: Integration and Verification Report
  kind: report
  status: draft
  purpose: Consolidated integration and verification report establishing bidirectional traceability between
    cybersecurity requirements, refined software architectural elements, and the verification specification
    (test cases and results), and summarizing results for communication to affected parties.
  concept: doc_concept_qx_csver_process
  complies:
  - std_wp_isosae21434_development_1057
