getting_started: '**Purpose**


  The purpose of the Cybersecurity Validation process is to confirm, with the item / component in its
  intended operational environment and typical release configuration, that the cybersecurity goals are
  achieved, the cybersecurity claims are valid, and every operational-environment-dependent requirement
  remains valid. This process ensures that:


  - Validation activities at item / component level confirm the adequacy of the cybersecurity goals against
  the threat scenarios and risks, achievement of the goals, validity of the claims, and validity of the
  operational-environment requirements.

  - A rationale is provided for the validation activities selected, including cases where a CAL-indicated
  method is not applied or a listed threat scenario is not tested.

  - Threat scenarios from UNECE R155 Annex 5 (and the organizational threat catalog) are classified and,
  where indicated, exercised through penetration testing.

  - Results already established by cybersecurity verification are reused where they cover a validation
  case, avoiding duplicate testing.


  This process directly supports compliance with ISO/SAE 21434 Clause 11 and ASPICE SEC.4 (Cybersecurity
  Validation), and consumes evidence produced by cybersecurity verification (Clause 10.4.2 / SEC.3).


  **Organizational Scope and Applicability**


  This process applies to every item / component for which cybersecurity goals, claims, and a cybersecurity
  concept have been baselined. For an item / component developed out-of-context, vehicle-level validation
  does not apply.


  **Lifecycle Relevance**


  Cybersecurity validation follows cybersecurity verification (ISO/SAE 21434 Clause 10.4.2) and is the
  last cybersecurity engineering activity before the item / component is released. Validation is repeated
  whenever the cybersecurity goals, claims, concept, or the operational environment / threat landscape
  considered for the item / component changes.


  **Preconditions and Dependencies**


  Typical preconditions include:


  - Baselined item / component definition (CS Item / Component Definition).

  - Threat analysis and risk assessment report (TARA Record).

  - Baselined cybersecurity goals (CS Goals) and claims (CS Claims).

  - Baselined cybersecurity concept (Cybersecurity Concept).

  - Cybersecurity verification results, where available (Integration and Verification Report).

  - The applicable UNECE R155 Annex 5 threat listing and the organizational threat catalog.


  **Governance and Compliance Context**


  This process:


  - Fulfills ISO/SAE 21434 Clause 11 requirements (RQ-11-01, RQ-11-02).

  - Consumes item definition (Clause 9.3), TARA (Clause 15), cybersecurity goals and claims (Clause 9.4),
  cybersecurity concept (Clause 9.5), and cybersecurity verification results (Clause 10.4.2).

  - Produces the mandatory cybersecurity validation report (WP-11-01) supporting the release decision
  for the item / component.


  **General Workflow**


  **Tooling Support**


  The required tooling for Cybersecurity validation must be specified as part of Cybersecurity Plan document.'
concepts:
- id: doc_concept_qx_csval_process
  title: Cybersecurity Validation Concept
  body: '**Motivation**


    Cybersecurity validation (Clause 11) confirms, with the item / component in its intended operational
    environment and typical release configuration, that the cybersecurity goals are achieved, the cybersecurity
    claims are valid, and every requirement that depends on the operational environment remains valid.
    It also confirms that no unreasonable residual risk remains. This is distinct from cybersecurity verification
    (Clause 10.4.2 / ASPICE SEC.3), which confirms that the implementation conforms to the cybersecurity
    specification at software and system integration level. Validation instead asks whether the goals
    and claims set out in item definition, cybersecurity goals and claims, and the cybersecurity concept
    actually hold once the item / component is exposed to real operating conditions and the threat landscape
    defined for the item / component. Without this step, an item / component that passes verification
    could still fail to protect its digital assets once deployed, or could rest on a claim that does not
    hold in the field.


    Inputs considered for Cybersecurity Validation include


    - ISO/SAE 21434 Clause 11 (Cybersecurity Validation).

    - ASPICE SEC.4 (Cybersecurity Validation).

    - UNECE R155 Annex 5 (threats and corresponding mitigations).

    - Cybersecurity item / component definition (Clause 9.3).

    - Threat analysis and risk assessment report (Clause 15).

    - Cybersecurity goals and claims (Clause 9.4).

    - Cybersecurity concept (Clause 9.5).

    - Work products from product development, including cybersecurity verification results (Clause 10.4.2).


    **Input Artifacts**


    - Item / component definition (CS Item / Component Definition).

    - Threat analysis and risk assessment report (''TARA`).

    - Cybersecurity goals (CS Goals) and cybersecurity claims (CS Claims).

    - Cybersecurity concept (Cybersecurity Concept).

    - Verification results from cybersecurity verification (Verification Report for the Refined Specifications,
    Vulnerability Analysis Report, Integration and Verification Report), reused wherever they already
    cover a validation case.

    - Organizational threat database: the UNECE R155 Annex 5 threat listing and a CAPEC-based asset threat
    catalog maintained by the organization.


    **Approach**


    RQ-11-01 requires confirmation, at item / component level, of the adequacy of the cybersecurity goals
    against the threat scenarios and risks, achievement of the goals, validity of the claims, and validity
    of operational-environment-dependent requirements. Cybersecurity verification (Clause 10.4.2 / SEC.3)
    already exercises requirement-based, functional interface, static, dynamic, and fuzz testing at software
    / system integration level. Penetration testing is the validation-specific method not exercised. It
    targets the integrated item / component (or vehicle level, where applicable) from an attacker''s perspective,
    under real or representative operating conditions, to confirm exploitability of any residual threat
    exposure. Where a validation case is already covered by a verification result, that result is reused
    and referenced instead of being re-tested.


    Threat-Scenario Classification


    Every threat scenario in the applicable UNECE R155 Annex 5 listing (and, where in-scope, the organizational
    CAPEC-based asset threat catalog) is classified before a validation case is derived.


    Threat scenarios already covered by a validation case against a cybersecurity goal are cross-referenced
    rather than duplicated.


    Validation Strategy


    A validation strategy is developed covering the objective (goal achievement and freedom from the applicable
    R155 threats), validation methods, techniques and tools, the work products or processes under validation,
    and a schedule. Where the CAL-indicated rigor for a goal is not fully applied, or a listed threat
    scenario is not tested, a documented rationale is recorded. High-CAL penetration testing may be delegated
    to an external vendor for greater rigor, independence, and expertise. This should also be recorded
    in Validation strategy. In addition, the vendor''s test strategy is requested as summary information
    alongside its report.


    Penetration Testing


    Penetration testing is performed from an attacker''s perspective: vulnerabilities in the item / component
    are identified and exploited to assess actual damage potential, so that they can be addressed before
    deployment.


    The penetration testing activity proceeds in seven steps:


    1. Planning — test objectives are derived from the item''s high-level functions, the impact of malfunction
    or unavailability, and the sensitive information reachability. Effort, time, and resources are estimated
    and allocated. 2. Preparation — a test environment is established, required tools are set up, and
    dynamic item / component behavior is explored. 3. Discovery — interfaces, components, and their connections
    are enumerated, and specifications and public information are collected, using source code audit,
    binary disassembly, fuzzing, scanning, runtime analysis, network sniffing, configuration review, and
    security function testing and are applied iteratively. 4. Presentation — the test focus derived from
    the discovery stage is presented to stakeholders as a test plan, with threat scenarios classified
    per the threat-scenario classification above. 5. Attack / Test execution — access to communication
    channels (e.g. CAN, Ethernet, Wi-Fi), local external interfaces (e.g. USB, serial), or direct hardware
    access (e.g. JTAG, SPI) is gained, escalated where possible, and used to retrieve further sensitive
    information or install tools to assess impact. 6. Evaluation — results are evaluated in terms of attack
    feasibility and impact. 7. Reporting — findings are consolidated in Penetration Test Report (Internal
    / External), comprising test description, identified vulnerabilities, attack feasibility, impact,
    and remediation suggestions, and presented to the party responsible for the item.


    NOTE: where penetration testing is performed by an external vendor for higher CAL rigor, independence,
    or expertise, the vendor is not required to follow these seven steps identically; the strategy used
    is nonetheless requested as summary information alongside the resulting report.


    **ASPICE Alignment**


    This process supports:


    SEC.4 outcomes by confirming, at item / component level, achievement of the cybersecurity goals, validity
    of the cybersecurity claims, and validity of operational-environment-dependent requirements, and by
    recording a rationale for the validation activities selected.


    **Tailoring Information**


    - For an item / component developed out-of-context, vehicle-level validation does not apply.

    - Penetration testing rigor and independence scale with the CAL of the realized cybersecurity goal(s);
    high-CAL testing may be delegated to an external vendor and methodology is documented as part of Validation
    Strategy and final results to be included in Validation Result.

    - Where a validation case is already covered by a cybersecurity verification result, it is referenced
    rather than re-tested (Rationale for selection of validation activities).'
