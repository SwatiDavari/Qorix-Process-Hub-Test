# Cybersecurity Threat Analysis and Risk Assessment (compliance/security/csms_tara)  -  work products.
work_products:
- id: wp_qx_cstara_tara_record
  title: TARA Record
  kind: record
  status: draft
  purpose: Consolidated Threat Analysis and Risk Assessment record for the item or component, rolling
    up damage scenarios, assets with cybersecurity properties, threat scenarios, impact ratings, attack
    paths, attack feasibility ratings, risk values, and risk treatment decisions into the single baselined
    deliverable of Decide Risk Treatment, structured per Threat Analysis and Risk Assessment Template.
    Every other work product on this page is one section of this record; they are also listed individually
    so each can carry its own compliance link to its ISO/SAE 21434 Clause 15 work product.
  concept: doc_concept_qx_cstara_process
  complies:
  - std_wp_isosae21434_assessment_15331
  - std_wp_isosae21434_assessment_15332
  - std_wp_isosae21434_assessment_15431
  - std_wp_isosae21434_assessment_15531
  - std_wp_isosae21434_assessment_15631
  - std_wp_isosae21434_assessment_15731
  - std_wp_isosae21434_assessment_15831
  - std_wp_isosae21434_assessment_15931
- id: wp_qx_cstara_damage_scenarios
  title: Damage Scenarios
  kind: analysis
  status: draft
  purpose: 'Register of damage scenarios: the adverse consequence to a road user resulting from compromise
    of one cybersecurity property of one asset. Foundation for impact rating and threat scenario identification.'
  concept: doc_concept_qx_cstara_process
  complies:
  - std_wp_isosae21434_assessment_15331
- id: wp_qx_cstara_assets_with_cs_properties
  title: Assets with Cybersecurity Properties
  kind: record
  status: draft
  purpose: Register of identified cybersecurity assets, each traced to the item feature or interface it
    originates from, with the applicable cybersecurity properties (confidentiality, integrity, availability,
    authenticity, authorization, non-repudiation) and the rationale for each rating.
  concept: doc_concept_qx_cstara_process
  template: gd_temp_qx_cstara_threat_analysis_and_risk
  complies:
  - std_wp_isosae21434_assessment_15332
- id: wp_qx_cstara_threat_scenarios
  title: Threat Scenarios
  kind: analysis
  status: draft
  purpose: Register of unique threat scenarios, each traced to one asset, one compromised cybersecurity
    property, and one damage scenario.
  concept: doc_concept_qx_cstara_process
  complies:
  - std_wp_isosae21434_assessment_15431
- id: wp_qx_cstara_impact_ratings
  title: Impact Ratings
  kind: analysis
  status: draft
  purpose: Impact ratings for every damage scenario across safety, financial, operational, and privacy
    categories, with the combined weighted impact value and its justification.
  concept: doc_concept_qx_cstara_process
  complies:
  - std_wp_isosae21434_assessment_15531
- id: wp_qx_cstara_attack_paths
  title: Attack Paths
  kind: analysis
  status: draft
  purpose: Catalog of feasible attack paths (attack vector, layer, starting point, method, mechanism)
    and their mapping to the threat scenario(s) each realizes.
  concept: doc_concept_qx_cstara_process
  complies:
  - std_wp_isosae21434_assessment_15631
- id: wp_qx_cstara_attack_feasibility_ratings
  title: Attack Feasibility Ratings
  kind: analysis
  status: draft
  purpose: Attack-potential-based feasibility rating for every attack path (elapsed time, specialist expertise,
    knowledge of the item, window of opportunity, equipment), and the governing rating carried to each
    threat scenario.
  concept: doc_concept_qx_cstara_process
  complies:
  - std_wp_isosae21434_assessment_15731
- id: wp_qx_cstara_risk_values
  title: Risk Values
  kind: analysis
  status: draft
  purpose: Risk value for every threat scenario, derived from its weighted impact rating and governing
    attack feasibility rating via the fixed risk matrix.
  concept: doc_concept_qx_cstara_process
  complies:
  - std_wp_isosae21434_assessment_15831
- id: wp_qx_cstara_risk_treatment_decisions
  title: Risk Treatment Decisions
  kind: analysis
  status: draft
  purpose: Risk treatment decision (avoid, reduce, retain, share/transfer) for every threat scenario,
    with rationale, resulting Cybersecurity Assurance Level (CAL) where applicable, and the forward link
    to the cybersecurity goal or claim it feeds.
  concept: doc_concept_qx_cstara_process
  complies:
  - std_wp_isosae21434_assessment_15931
- id: wp_qx_cstara_tara_review_record
  title: TARA Review Record
  kind: report
  status: draft
  purpose: 'Completed review checklists for the TARA record: technical review result against Threat Analysis
    and Risk Assessment Review Checklist, findings with Issue Tracking IDs and closure status, approvals,
    and the Quality Manager check result against TARA Quality Check Checklist. For an update of a baselined
    TARA, item 23 of the technical review checklist also holds the change impact analysis and update decision.
    No separate template is used. Identifies the reviewed version of TARA Record.'
  concept: doc_concept_qx_cstara_process
  complies:
  - std_req_isosae21434_assessment_153
  - std_req_isosae21434_assessment_154
  - std_req_isosae21434_assessment_155
  - std_req_isosae21434_assessment_156
  - std_req_isosae21434_assessment_157
  - std_req_isosae21434_assessment_158
  - std_req_isosae21434_assessment_159
