# Cybersecurity Threat Analysis and Risk Assessment (compliance/security/csms_tara)  -  workflows.
workflows:
- id: wf_qx_cstara_identify_assets_and_damage
  title: Identify Assets and Damage Scenarios
  status: draft
  responsible: rl_qx_csgoal_engineer
  approved_by: rl_qx_csitem_cs_product_owner
  supported_by:
  - rl_qx_csitem_cs_manager
  - rl_qx_csitem_software_architect_lead_engineer
  - rl_qx_csitem_system_architect
  input:
  - wp_qx_csitem_cs_item_comp_def
  output:
  - wp_qx_cstara_assets_with_cs_properties
  - wp_qx_cstara_damage_scenarios
  achieves:
  - oc_qx_cstara_cs_threat_analysis_and_risk_assm
  gate:
  - wp: wp_qx_csitem_cs_item_comp_def
    min_status: approved
  contains:
  - gd_guidl_qx_cstara_threat_analysis_and_risk
  - gd_req_qx_cstara_asset_identification_and_cs
  - gd_req_qx_cstara_damage_scenario
  - gd_temp_qx_cstara_threat_analysis_and_risk
  description: The item's features and interfaces are studied and every candidate asset is rated against
    the six cybersecurity properties; an asset is confirmed only where at least one property applies and
    at least one damage scenario is identified for it, both recorded in Assets with Cybersecurity Properties
    and Damage Scenarios.
  activities:
  - step: The item's features and interfaces are studied and every candidate asset is rated against the
      six cybersecurity properties; an asset is confirmed only where at least one property applies and
      at least one damage scenario is identified for it, both recorded in
    by: rl_qx_csgoal_engineer
    capability: cap_qx_cstara_cs_threat_analysis_and_risk
  - step: Contribute to assets with cybersecurity properties
    by: rl_qx_csitem_cs_manager
  - step: Contribute to assets with cybersecurity properties
    by: rl_qx_csitem_software_architect_lead_engineer
  - step: Contribute to assets with cybersecurity properties
    by: rl_qx_csitem_system_architect
  - step: Approve assets with cybersecurity properties, damage scenarios
    by: rl_qx_csitem_cs_product_owner
- id: wf_qx_cstara_rate_impact
  title: Rate Impact
  status: draft
  responsible: rl_qx_csgoal_engineer
  approved_by: rl_qx_csitem_cs_product_owner
  supported_by:
  - rl_qx_csitem_cs_manager
  - rl_qx_csitem_software_architect_lead_engineer
  input:
  - wp_qx_cstara_damage_scenarios
  output:
  - wp_qx_cstara_impact_ratings
  achieves:
  - oc_qx_cstara_cs_threat_analysis_and_risk_assm
  contains:
  - gd_guidl_qx_cstara_impact_and_attack
  - gd_req_qx_cstara_impact_category_rating
  - gd_req_qx_cstara_weighted_impact_rating
  - gd_req_qx_cstara_impact_rating_justification
  - gd_req_qx_cstara_independent_review_of
  description: Every damage scenario is rated across safety, financial, operational, and privacy impact
    categories and combined into one weighted impact value using the method of Impact and Attack Feasibility
    Rating Metrics, recorded with justification in Impact Ratings. Impact rating depends only on the damage
    scenario, not on how it could be threatened, so it proceeds ahead of threat scenario identification.
  activities:
  - step: Every damage scenario is rated across safety, financial, operational, and privacy impact categories
      and combined into one weighted impact value using the method of Impact and Attack Feasibility Rating
      Metrics, recorded with justification in Impact Ratings
    by: rl_qx_csgoal_engineer
    capability: cap_qx_cstara_cs_threat_analysis_and_risk
  - step: Contribute to impact ratings
    by: rl_qx_csitem_cs_manager
  - step: Contribute to impact ratings
    by: rl_qx_csitem_software_architect_lead_engineer
  - step: Approve impact ratings
    by: rl_qx_csitem_cs_product_owner
- id: wf_qx_cstara_identify_threat_scenarios
  title: Identify Threat Scenarios
  status: draft
  responsible: rl_qx_csgoal_engineer
  approved_by: rl_qx_csitem_cs_product_owner
  supported_by:
  - rl_qx_csitem_cs_manager
  - rl_qx_csitem_software_architect_lead_engineer
  input:
  - wp_qx_cstara_assets_with_cs_properties
  - wp_qx_cstara_damage_scenarios
  output:
  - wp_qx_cstara_threat_scenarios
  achieves:
  - oc_qx_cstara_cs_threat_analysis_and_risk_assm
  contains:
  - gd_req_qx_cstara_threat_scenario
  description: Every confirmed asset / property / damage scenario combination is analyzed for how a threat
    could exploit it, and each distinct threat scenario is uniquely recorded in Threat Scenarios.
  activities:
  - step: Every confirmed asset / property / damage scenario combination is analyzed for how a threat
      could exploit it, and each distinct threat scenario is uniquely recorded in Threat Scenarios
    by: rl_qx_csgoal_engineer
    capability: cap_qx_cstara_cs_threat_analysis_and_risk
  - step: Contribute to threat scenarios
    by: rl_qx_csitem_cs_manager
  - step: Contribute to threat scenarios
    by: rl_qx_csitem_software_architect_lead_engineer
  - step: Approve threat scenarios
    by: rl_qx_csitem_cs_product_owner
- id: wf_qx_cstara_analyze_attack_paths
  title: Analyze Attack Paths
  status: draft
  responsible: rl_qx_csgoal_engineer
  approved_by: rl_qx_csitem_cs_product_owner
  supported_by:
  - rl_qx_csitem_cs_manager
  - rl_qx_csitem_software_architect_lead_engineer
  input:
  - wp_qx_cstara_threat_scenarios
  output:
  - wp_qx_cstara_attack_paths
  achieves:
  - oc_qx_cstara_cs_threat_analysis_and_risk_assm
  contains:
  - gd_req_qx_cstara_attack_path_identification
  - gd_req_qx_cstara_attack_path_to_threat
  description: Feasible attack paths realizing each threat scenario are identified and described (attack
    vector, attack layer, starting point, method, and mechanism), then mapped one-to-many to the threat
    scenarios they realize, recorded in Attack Paths.
  activities:
  - step: Feasible attack paths realizing each threat scenario are identified and described (attack vector,
      attack layer, starting point, method, and mechanism), then mapped one-to-many to the threat scenarios
      they realize, recorded in Attack Paths
    by: rl_qx_csgoal_engineer
    capability: cap_qx_cstara_cs_threat_analysis_and_risk
  - step: Contribute to attack paths
    by: rl_qx_csitem_cs_manager
  - step: Contribute to attack paths
    by: rl_qx_csitem_software_architect_lead_engineer
  - step: Approve attack paths
    by: rl_qx_csitem_cs_product_owner
- id: wf_qx_cstara_rate_attack_feasibility
  title: Rate Attack Feasibility
  status: draft
  responsible: rl_qx_csgoal_engineer
  approved_by: rl_qx_csitem_cs_product_owner
  supported_by:
  - rl_qx_csitem_cs_manager
  - rl_qx_csitem_software_architect_lead_engineer
  input:
  - wp_qx_cstara_attack_paths
  output:
  - wp_qx_cstara_attack_feasibility_ratings
  achieves:
  - oc_qx_cstara_cs_threat_analysis_and_risk_assm
  contains:
  - gd_guidl_qx_cstara_impact_and_attack
  - gd_req_qx_cstara_consistent_attack
  - gd_req_qx_cstara_attack_potential_factor
  - gd_req_qx_cstara_attack_potential_value
  - gd_req_qx_cstara_attack_feasibility_rating
  - gd_req_qx_cstara_governing_attack
  description: Every attack path is rated using the attack-potential-based method of Impact and Attack
    Feasibility Rating Metrics (elapsed time, specialist expertise, knowledge of the item, window of opportunity,
    equipment), recorded in Attack Feasibility Ratings.
  activities:
  - step: Every attack path is rated using the attack-potential-based method of Impact and Attack Feasibility
      Rating Metrics (elapsed time, specialist expertise, knowledge of the item, window of opportunity,
      equipment), recorded in Attack Feasibility Ratings
    by: rl_qx_csgoal_engineer
    capability: cap_qx_cstara_cs_threat_analysis_and_risk
  - step: Contribute to attack feasibility ratings
    by: rl_qx_csitem_cs_manager
  - step: Contribute to attack feasibility ratings
    by: rl_qx_csitem_software_architect_lead_engineer
  - step: Approve attack feasibility ratings
    by: rl_qx_csitem_cs_product_owner
- id: wf_qx_cstara_determine_risk_value
  title: Determine Risk Value
  status: draft
  responsible: rl_qx_csgoal_engineer
  approved_by: rl_qx_csitem_cs_product_owner
  supported_by:
  - rl_qx_csitem_cs_manager
  input:
  - wp_qx_cstara_impact_ratings
  - wp_qx_cstara_attack_feasibility_ratings
  output:
  - wp_qx_cstara_risk_values
  achieves:
  - oc_qx_cstara_cs_threat_analysis_and_risk_assm
  contains:
  - gd_guidl_qx_cstara_impact_and_attack
  - gd_req_qx_cstara_risk_value_determination
  - gd_req_qx_cstara_risk_value_recording
  description: The weighted impact rating and the governing attack feasibility rating of each threat scenario
    are combined via the fixed risk matrix of Impact and Attack Feasibility Rating Metrics, and the resulting
    risk value is recorded in Risk Values.
  activities:
  - step: The weighted impact rating and the governing attack feasibility rating of each threat scenario
      are combined via the fixed risk matrix of Impact and Attack Feasibility Rating Metrics, and the
      resulting risk value is recorded in Risk Values
    by: rl_qx_csgoal_engineer
    capability: cap_qx_cstara_cs_threat_analysis_and_risk
  - step: Contribute to risk values
    by: rl_qx_csitem_cs_manager
  - step: Approve risk values
    by: rl_qx_csitem_cs_product_owner
- id: wf_qx_cstara_decide_risk_treatment
  title: Decide Risk Treatment
  status: draft
  responsible: rl_qx_csgoal_engineer
  approved_by: rl_qx_csitem_cs_product_owner
  supported_by:
  - rl_qx_csitem_cs_manager
  - rl_qx_csitem_software_architect_lead_engineer
  input:
  - wp_qx_cstara_risk_values
  output:
  - wp_qx_cstara_risk_treatment_decisions
  - wp_qx_cstara_tara_record
  - wp_qx_cstara_tara_review_record
  achieves:
  - oc_qx_cstara_cs_threat_analysis_and_risk_assm
  contains:
  - gd_req_qx_cstara_risk_treatment_decision
  - gd_chklst_qx_cstara_threat_analysis_and_risk
  description: A risk treatment decision — avoid, reduce, retain, or share/transfer — is made for every
    threat scenario, recorded with rationale and Cybersecurity Assurance Level (CAL) in Risk Treatment
    Decisions. The consolidated TARA Record is technically reviewed by Cybersecurity Product Owner against
    Threat Analysis and Risk Assessment Review Checklist; the review is recorded in TARA Review Record.
  activities:
  - step: A risk treatment decision — avoid, reduce, retain, or share/transfer — is made for every threat
      scenario, recorded with rationale and Cybersecurity Assurance Level (CAL) in Risk Treatment Decisions
    by: rl_qx_csgoal_engineer
    capability: cap_qx_cstara_cs_threat_analysis_and_risk
  - step: Contribute to risk treatment decisions
    by: rl_qx_csitem_cs_manager
  - step: Contribute to risk treatment decisions
    by: rl_qx_csitem_software_architect_lead_engineer
  - step: Approve risk treatment decisions, tara record, tara review record
    by: rl_qx_csitem_cs_product_owner
- id: wf_qx_cstara_analyze_change_impact_on_a
  title: Analyze Change Impact on a Baselined TARA
  status: draft
  responsible: rl_qx_csgoal_engineer
  approved_by: rl_qx_csitem_cs_product_owner
  supported_by:
  - rl_qx_csitem_cs_manager
  - rl_qx_csitem_software_architect_lead_engineer
  - rl_qx_csitem_product_project_manager
  input:
  - wp_qx_cstara_tara_record
  - wp_qx_csitem_cs_item_comp_def
  - wp_qx_req_stakeholder_needs
  - wp_qx_csitem_consortium_regulatory_sources
  - wp_qx_cscont_vulnerability_analysis
  output:
  - wp_qx_cstara_tara_record
  - wp_qx_cstara_tara_review_record
  achieves:
  - oc_qx_cstara_cs_threat_analysis_and_risk_assm
  contains:
  - gd_req_qx_cstara_tara_update_triggers
  - gd_req_qx_cstara_tara_change_impact_analysis
  - gd_chklst_qx_cstara_threat_analysis_and_risk
  description: Every update trigger of TARA update triggers raised against a baselined TARA Record is
    analyzed for its impact on assets, damage scenarios, threat scenarios, attack paths, risk values,
    and risk treatment decisions. Cybersecurity Product Owner decides whether an update is required; Cybersecurity
    Manager approves the decision.
  activities:
  - step: Every update trigger of TARA update triggers raised against a baselined TARA Record is analyzed
      for its impact on assets, damage scenarios, threat scenarios, attack paths, risk values, and risk
      treatment decisions
    by: rl_qx_csgoal_engineer
    capability: cap_qx_cstara_cs_threat_analysis_and_risk
  - step: Contribute to tara record
    by: rl_qx_csitem_cs_manager
  - step: Contribute to tara record
    by: rl_qx_csitem_software_architect_lead_engineer
  - step: Contribute to tara record
    by: rl_qx_csitem_product_project_manager
  - step: Approve tara record, tara review record
    by: rl_qx_csitem_cs_product_owner
