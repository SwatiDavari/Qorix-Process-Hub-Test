  achieves:
  - oc_qx_cstara_cs_threat_analysis_and_risk_assm
  contains:
  - gd_chklst_qx_cstara_tara_quality_check
  description: Before each baseline, the Quality Manager confirms that TARA Record was produced, reviewed,
    and approved as defined by this process. The result is added to TARA Review Record.
  activities:
  - step: Before each baseline, the Quality Manager confirms that TARA Record was produced, reviewed,
      and approved as defined by this process
