# Security (compliance/security)  -  workflows.
workflows:
- id: wf_qx_sec_incident_response
  title: Coordinate Organisation Level Incident Response
  status: draft
  responsible: rl_qx_sec_security_office
  approved_by: rl_qx_gc_head
  supported_by:
  - rl_qx_saf_safety_office
  input:
  - wp_qx_sec_policies
  output:
  - wp_qx_sec_incident_report
  achieves:
  - oc_qx_sec_incidents_handled
  gate:
  - wp: wp_qx_sec_policies
    min_status: approved
  description: The Cybersecurity Office coordinates the response to a security incident that crosses projects
    or meets the threshold for organisation level handling. The Safety Office supports where a security
    incident has safety implications. An incident report is produced and shared with affected projects.
  activities:
  - step: Confirm the incident meets the threshold for organisation level handling
    by: rl_qx_sec_security_office
    capability: cap_qx_sec_incident_coordination
  - step: Coordinate containment and correction across the affected projects
    by: rl_qx_sec_security_office
    capability: cap_qx_sec_incident_coordination
  - step: Support the response where the incident has safety implications
    by: rl_qx_saf_safety_office
  - step: Issue the incident report to the affected projects
    by: rl_qx_sec_security_office
    capability: cap_qx_sec_incident_coordination
  - step: Approve the incident report
    by: rl_qx_gc_head

- id: wf_qx_sec_maintain_csms
  title: Maintain Cybersecurity Management System
  status: draft
  responsible: rl_qx_sec_security_office
  approved_by: rl_qx_gc_head
  supported_by:
  - rl_qx_qa_quality_office
  input:
  - wp_qx_sec_incident_report
  output:
  - wp_qx_sec_policies
  achieves:
  - oc_qx_sec_management_maintained
  gate:
  - wp: wp_qx_sec_incident_report
    min_status: proposed
  description: The Cybersecurity Office reviews the Cybersecurity Management System at least once per
    year against ISO/SAE 21434 and updates it based on incident reports and threat intelligence. The Head
    of G&C approves changes to the organisation level security baseline.
  activities:
  - step: Review the management system against its standard, the incident reports and threat information
    by: rl_qx_sec_security_office
    capability: cap_qx_sec_management_review
  - step: Update the management system document
    by: rl_qx_sec_security_office
    capability: cap_qx_sec_management_review
  - step: Check the update against the audit findings
    by: rl_qx_qa_quality_office
  - step: Approve changes to the organisation level security baseline
    by: rl_qx_gc_head
