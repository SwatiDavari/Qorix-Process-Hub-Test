getting_started: '**Purpose**


  The purpose of the Cybersecurity Goals and Claims process is to specify cybersecurity goals and cybersecurity
  claims based on the risk treatment decisions determined in TARA, and to verify that they are correct,
  complete, and consistent.


  This process ensures that:


  - Every "reducing the risk" decision has one or more traceable cybersecurity goals.

  - Every "sharing the risk" or "retaining the risk" decision has one or more traceable cybersecurity
  claims, each with a verification plan or exemption justification.

  - Cybersecurity goals and claims are verified before being used as input to cybersecurity requirements
  (Clause 9.5).


  This process directly supports compliance with ISO/SAE 21434 Clause 9.4 and provides critical inputs
  to cybersecurity concept (Clause 9.5) and cybersecurity product development (Clause 10).


  **Organizational Scope and Applicability**


  This process applies whenever a TARA has produced risk treatment decisions for a cybersecurity-relevant
  item or component, regardless of whether the item is developed in full context or out of context.


  **Lifecycle Relevance**


  Cybersecurity goals and claims follow TARA and precede:


  - Cybersecurity concept (ISO/SAE 21434 Clause 9.5)

  - Cybersecurity product development (Clause 10)


  Goals and claims are refined whenever TARA risk treatment decisions change.


  **Preconditions and Dependencies**


  Typical preconditions include:


  - Baselined item definition (CS Item / Component Definition)

  - TARA with risk treatment decisions per threat scenario

  - Cybersecurity plan, for CS scope and schedule


  **General Workflow**


  1. Define Cybersecurity Goals — derive cybersecurity goals for "reducing the risk" decision. 2. Define
  Cybersecurity Claims — derive cybersecurity claims for "sharing the risk" or "retaining the risk" decisions.
  3. Review and Rework CS Goals and Claims — technically review, rework, and approve both work products.
  4. Quality Check of CS Goals and Claims — quality check of the reviewed and approved work products before
  baseline.


  Before every baseline, CS Goals and CS Claims are technically reviewed by Software Architect / Lead
  Engineer, approved by Cybersecurity Product Owner and Cybersecurity Manager, and quality checked by
  Quality Office in Quality Check of CS Goals and Claims (see the Review Sequence in the workflow description).


  **Governance and Compliance Context**


  This process:


  - Fulfills ISO/SAE 21434 Clause 9.4 requirements (RQ-09-03 through RQ-09-07).

  - Provides mandatory inputs to Clause 9.5 (cybersecurity concept) and Clause 10.

  - Applies quality assurance (ASPICE SUP.1, ISO/SAE 21434 Clause 5.4.4) through the Quality Manager check
  in Quality Check of CS Goals and Claims.'
concepts:
- id: doc_concept_qx_csgoal_process
  title: Cybersecurity Goals and Claims Concept
  body: '**Motivation**


    Cybersecurity goals and cybersecurity claims translate TARA risk treatment decisions into concept-level
    statements that drive downstream cybersecurity requirements.


    - A goal states what must be protected and why;

    - A claim states why an accepted risk is adequately handled. Without this step, risk treatment decisions
    in TARA remain un-actioned and untraceable to Clause 10 requirements.


    Inputs considered for this concept include ISO/SAE 21434 Clause 9.4 (Cybersecurity Goals and Cybersecurity
    Claims), the risk treatment decisions and risk rank produced by TARA (Clause 15), and the item definition
    (Clause 9.3).


    **Inputs**


    - Item definition (CS Item / Component Definition)

    - TARA risk treatment decisions and risk rank per threat scenario

    - Cybersecurity plan, for CS scope and schedule


    **Approach**


    Risk Treatment Decisions


    Every threat scenario in TARA carries one risk treatment decision: avoid, reduce, share, or retain.
    Reduce leads to a cybersecurity goal; share and retain lead to a cybersecurity claim; avoid removes
    the risk source through a change to the item definition and leads to neither. Meaning, use, and records
    per option are described in the Risk Treatment Options section of Cybersecurity Goals and Claims.


    Cybersecurity Goals


    A cybersecurity goal is a concept-level security requirement protecting a cybersecurity property of
    an asset against a threat identified in TARA. Goals are:


    - Abstract: high-level, broad objectives.

    - Directional: they guide subsequent design and requirements without prescribing a solution.

    - Impactful: they focus on the outcome — protecting the relevant cybersecurity property.


    A CAL is determined for each goal from the impact rating and attack vector of the associated threat
    scenario (see CS Goals Template for the matrix).


    Cybersecurity Claims


    A cybersecurity claim is a statement accepting a previously identified risk in a defined way, used
    when the risk treatment decision is "sharing the risk" or "retaining the risk" due to one or more
    assumptions. Claims fall into three types, viz.:


    - Function-specific,

    - General, and

    - System-level.


    Every claim carries a verification plan, responsible person, verification criteria (or exemption rationale),
    reference to the last verification report, periodicity, stakeholders to notify on failure, and actions
    on failure. In scenarios where a claim is not verifiable, the rationale / justification for exemption
    is documented.


    Verification


    A verification confirms correctness, completeness, and consistency of the item definition, TARA, risk
    treatment decisions, and the derived goals and claims, and is recorded in CS Goals and Claims Verification
    Report.


    **Review Concept**


    CS Goals and CS Claims pass two separate reviews before every baseline:


    - Technical review (Software Architect / Lead Engineer): Are goals and claims correct, complete, consistent,
    and traceable to TARA? Uses CS Goals Verification Checklist and CS Claims Verification Checklist.

    - Quality check (Quality Office): Was the process followed? Uses CS Goals and Claims Quality Check
    Checklist. No re-review of technical content.


    Approval is given by Cybersecurity Product Owner and the project-allotted Cybersecurity Manager. Both
    review results and the approvals are kept in CS Goals and Claims Verification Report. The Quality
    Manager is reused from the Quality House; no separate cybersecurity quality role exists.


    **ASPICE Alignment**


    This process supports:


    - MAN.7 outcomes by consuming risk treatment decisions from cybersecurity risk management.

    - SEC.1 outcomes by providing concept-level goals and claims as basis for cybersecurity requirements
    elicitation.

    - SUP.1 outcomes, by an independent quality check of CS Goals and CS Claims before each baseline.


    **Tailoring Information**


    Concept depth may vary depending on:


    - Whether the item / component is developed out of context.

    - The number and diversity of threat scenarios in TARA.

    - Whether risk sharing/retention is used at all in the project (some scenario may treat all risk by
    reduction, in which case no claims are produced).'
