  - rl_qx_csgov_support_functions
  input:
  - wp_qx_csgov_cs_policy_rules_and_governance
  output:
  - wp_qx_csgov_cs_policy_rules_and_governance
  achieves:
  - oc_qx_csgov_cs_governance
  description: 'Governance Deployment: Communicate policies across the organization; Integrate governance
    into management systems; Allocate resources and competence development mechanisms.'
  activities:
  - step: Communicate policies across the organization
    by: rl_qx_csgov_governance_and_compliance_group
    capability: cap_qx_csgov_cs_governance
  - step: Integrate governance into management systems
    by: rl_qx_csgov_governance_and_compliance_group
    capability: cap_qx_csgov_cs_governance
  - step: Allocate resources and competence development mechanisms
    by: rl_qx_csgov_governance_and_compliance_group
    capability: cap_qx_csgov_cs_governance
  - step: Approve cybersecurity policy, rules, and governance processes
    by: rl_qx_csgov_executive_mgmt
- id: wf_qx_csgov_operational_integration
  title: Operational Integration
  status: draft
  responsible: rl_qx_csgov_governance_and_compliance_group
  approved_by: rl_qx_csgov_executive_mgmt
  supported_by:
  - rl_qx_csgov_product_project_mgmt
  - rl_qx_csgov_engineering_roles
  - rl_qx_csgov_support_functions
  input:
  - wp_qx_csgov_cs_policy_rules_and_governance
  output:
  - wp_qx_csgov_cs_policy_rules_and_governance
  achieves:
  - oc_qx_csgov_cs_governance
  description: Cybersecurity governance operates in parallel with Cybersecurity processes are integrated
    with concept, development, validation, production, and post-development activities. Integration occurs
    early to reduce risk of late-stage conflicts.
  activities:
  - step: System engineering
    by: rl_qx_csgov_governance_and_compliance_group
    capability: cap_qx_csgov_cs_governance
  - step: Software engineering
    by: rl_qx_csgov_governance_and_compliance_group
    capability: cap_qx_csgov_cs_governance
  - step: Safety engineering
    by: rl_qx_csgov_governance_and_compliance_group
    capability: cap_qx_csgov_cs_governance
  - step: Approve cybersecurity policy, rules, and governance processes
    by: rl_qx_csgov_executive_mgmt
- id: wf_qx_csgov_lifecycle_oversight
