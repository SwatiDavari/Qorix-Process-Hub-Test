# Cybersecurity Governance (compliance/security/csms_governance)  -  workflows.
workflows:
- id: wf_qx_csgov_governance_establishment
  title: Governance Establishment
  status: draft
  responsible: rl_qx_csgov_governance_and_compliance_group
  approved_by: rl_qx_csgov_executive_mgmt
  supported_by:
  - rl_qx_csgov_product_project_mgmt
  - rl_qx_csgov_engineering_roles
  - rl_qx_csgov_support_functions
  input:
  - wp_qx_sec_policies
  output:
  - wp_qx_csgov_cs_policy_rules_and_governance
  achieves:
  - oc_qx_csgov_cs_governance
  gate:
  - wp: wp_qx_sec_policies
    min_status: approved
  description: 'Governance Establishment: Define cybersecurity policies and governance rules; Approve
    policies through management; Establish organizational roles and responsibilities.'
  activities:
  - step: Define cybersecurity policies and governance rules
    by: rl_qx_csgov_governance_and_compliance_group
    capability: cap_qx_csgov_cs_governance
  - step: Approve policies through management
    by: rl_qx_csgov_executive_mgmt
    capability: cap_qx_csgov_cs_governance
  - step: Establish organizational roles and responsibilities
    by: rl_qx_csgov_governance_and_compliance_group
    capability: cap_qx_csgov_cs_governance
  - step: Approve cybersecurity policy, rules, and governance processes
    by: rl_qx_csgov_executive_mgmt
- id: wf_qx_csgov_governance_deployment
  title: Governance Deployment
  status: draft
  responsible: rl_qx_csgov_governance_and_compliance_group
  approved_by: rl_qx_csgov_executive_mgmt
  supported_by:
  - rl_qx_csgov_product_project_mgmt
