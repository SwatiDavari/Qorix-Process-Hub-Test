  achieves:
  - oc_qx_csgov_cs_governance
  description: Governance oversight is maintained throughout
  activities:
  - step: Concept and risk assessment
    by: rl_qx_csgov_governance_and_compliance_group
    capability: cap_qx_csgov_cs_governance
  - step: Development and integration
    by: rl_qx_csgov_governance_and_compliance_group
    capability: cap_qx_csgov_cs_governance
  - step: Validation and production readiness
    by: rl_qx_csgov_governance_and_compliance_group
    capability: cap_qx_csgov_cs_governance
  - step: Operation, maintenance, and monitoring
    by: rl_qx_csgov_governance_and_compliance_group
    capability: cap_qx_csgov_cs_governance
  - step: Decommissioning
    by: rl_qx_csgov_governance_and_compliance_group
    capability: cap_qx_csgov_cs_governance
  - step: Approve cybersecurity policy, rules, and governance processes
    by: rl_qx_csgov_executive_mgmt
