getting_started: '**Purpose**


  The Cybersecurity Governance process establishes and maintains the organizational framework required
  to support effective cybersecurity engineering. It defines the policies, rules, roles, responsibilities,
  and resources needed to achieve and sustain cybersecurity objectives across the automotive product lifecycle.


  This process ensures that cybersecurity activities are consistently directed, supported by management
  commitment, and embedded into organizational culture, thereby enabling compliance with ISO/SAE 21434
  Clause 5.4.1.


  **Scope and Applicability**


  This process applies to all organizational units involved in automotive product development, production,
  operation, and support where cybersecurity engineering activities are performed. It governs cybersecurity-related
  decision-making at organizational and product/project levels.


  The governance framework is applicable to:


  - All automotive items requiring ISO/SAE 21434 compliance

  - All lifecycle phases from concept to decommissioning

  - All engineering disciplines interacting with cybersecurity activities


  **Lifecycle Relevance**


  Cybersecurity Governance is lifecycle-wide and persistent. It provides the foundational direction and
  oversight required to:


  - Initiate cybersecurity activities during concept and planning

  - Integrate cybersecurity into system and software development

  - Support validation, production, operation, and maintenance

  - Enable continuous monitoring and improvement


  **Preconditions and Dependencies**


  No formal prerequisites are defined. The process leverages and aligns with existing organizational standards
  related to quality management, information security, and data privacy.


  **Governance and Compliance Context**


  Cybersecurity Governance is implemented through formally documented policies, rules, and processes maintained
  within the organizational quality management system. These governance elements are subject to independent
  audit and management review to ensure alignment with stated cybersecurity objectives and regulatory
  expectations.


  **Tailoring Considerations**


  Tailoring of governance application is permitted based on:


  - Organizational size and structure

  - Product portfolio complexity

  - Regulatory and customer requirements


  However:


  - The existence of cybersecurity governance policies

  - Management accountability

  - Allocation of resources and roles


  shall not be tailored out, regardless of product/project size or risk exposure.'
concepts:
- id: doc_concept_qx_csgov_process
  title: Cybersecurity Governance Concept
  body: '**Cybersecurity Governance Fundamentals**


    Cybersecurity Governance defines how the organization directs, controls, and supports cybersecurity
    engineering activities. It establishes executive intent, organizational accountability, and structured
    decision-making mechanisms to manage cybersecurity risks in the product.


    The governance framework acknowledges the evolving threat landscape and the need for systematic, risk-based
    protection of stakeholder assets. It ensures that cybersecurity objectives are aligned with organizational
    goals and regulatory requirements, enabling effective risk management and compliance with ISO/SAE
    21434.


    **Guiding Principles**


    Cybersecurity Governance is built upon guiding principles that shape organizational behavior and technical
    decision-making, including:


    - Understanding adversary capabilities and threat evolution

    - Identifying assets and defining protection proportional to criticality

    - Integrating cybersecurity into lifecycle management and engineering processes

    - Building trustworthy systems capable of protecting stakeholder assets


    **Cybersecurity Engineering Principles**


    The governance model promotes engineering principles that reduce inherent system vulnerabilities,
    such as:


    - Layered protection strategies

    - Defined security policies, architectures, and controls

    - Lifecycle integration of cybersecurity considerations

    - Clear physical and logical security boundaries

    - Continuous competence development for secure system development


    **Organizational Perspective**


    Cybersecurity Governance is organizational in nature. It does not mandate specific technical methods
    or implementation techniques. Instead, it defines the boundary conditions, expectations, and supporting
    environment within which cybersecurity engineering is executed.


    **Interfaces with Other Processes**


    The governance process interfaces with:


    - System engineering and software engineering processes

    - Safety engineering activities

    - Product/Project planning and management

    - Training, recruitment, and resource management


    These interfaces ensure cybersecurity objectives are considered consistently and early, reducing the
    likelihood of late-stage conflicts or gaps.


    **Tailoring Concept**


    Tailoring within the governance concept is based on:


    - Risk exposure of the item

    - Connectivity and attack surface

    - Development model and supplier involvement


    Tailoring affects how governance is applied, not whether it exists. All projects remain bound by organizational
    cybersecurity policies and rules.'
