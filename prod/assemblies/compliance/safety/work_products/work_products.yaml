# Safety (compliance/safety)  -  work products.
work_products:
- id: wp_qx_saf_platform_mgmt
  title: Safety Management System Document
  kind: definition
  status: draft
  purpose: The Functional Safety Management System document covering Qorix's organisation level safety
    activities, objectives, and process tailoring rules.
  template: gd_temp_qx_saf_fsms_template
  complies:
  - std_wp_iso26262_management_551
- id: wp_qx_saf_safety_tailoring
  title: Safety Tailoring Rules
  kind: rule
  status: draft
  purpose: Tailoring rules for project-level safety plans derived from the organisation level FSMS.
  template: gd_temp_qx_saf_tailoring_template
  complies:
  - std_req_iso15288_annex_a
  - std_req_aspice_40_iic_15_54
- id: wp_qx_saf_safety_anomaly_report
  title: Safety Anomaly Report
  kind: record
  status: draft
  purpose: Record of a safety anomaly, its analysis, resolution, and notification to affected projects.
  template: gd_temp_qx_saf_anomaly_template
  complies:
  - std_wp_iso26262_management_551
- id: wp_qx_saf_policies
  title: Safety Policies
  kind: policy
  status: draft
  purpose: Organisation level safety policies updated as output of safety management activities.
  template: gd_temp_qx_saf_fsms_template
  complies:
  - std_wp_iso26262_management_551
