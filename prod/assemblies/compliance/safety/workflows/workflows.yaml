# Safety (compliance/safety)  -  workflows.
workflows:
- id: wf_qx_saf_maintain_fsms
  title: Maintain Functional Safety Management System
  status: draft
  responsible: rl_qx_saf_safety_office
  approved_by: rl_qx_gc_head
  supported_by:
  - rl_qx_qa_quality_office
  input:
  - wp_qx_qa_audit_report
  output:
  - wp_qx_saf_platform_mgmt
  - wp_qx_saf_policies
  description: The Safety Office reviews the Functional Safety Management System at least once per year
    against ISO 26262 and quality metrics, and updates the FSMS document. The Head
    of G&C approves changes to the organisation level safety baseline.
- id: wf_qx_saf_safety_anomaly
  title: Manage Organisation Level Safety Anomaly
  status: draft
  responsible: rl_qx_saf_safety_office
  approved_by: rl_qx_gc_head
  supported_by:
  - rl_qx_sec_security_office
  input:
  - wp_qx_saf_policies
  output:
  - wp_qx_saf_safety_anomaly_report
  description: The Safety Office routes a reported safety anomaly in an organisation level asset, coordinates
    its analysis and correction, and ensures notification to affected projects. The Head of G&C approves
    any resulting policy change.
- id: wf_qx_saf_independent_assessment
  title: Perform Independent Functional Safety Assessment
  status: draft
  responsible: rl_qx_saf_independent_assessor
  approved_by: rl_qx_gc_head
  supported_by:
  - rl_qx_saf_safety_office
  input:
  - wp_qx_saf_safety_tailoring
  output:
  - wp_qx_qa_audit_report
  description: An independent assessor evaluates whether Qorix's functional safety activities achieve
    the objectives of ISO 26262. The assessment covers process compliance and product-level safety cases.
    Findings are recorded as an assessment report.
