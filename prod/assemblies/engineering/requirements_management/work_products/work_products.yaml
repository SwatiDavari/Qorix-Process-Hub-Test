# Requirements Management and Traceability (engineering/requirements_management)  -  work products.
work_products:
- id: wp_qx_req_stakeholder_needs
  title: "Stakeholder Needs"
  status: draft
  purpose: "Needs and constraints stated by customers, regulators and internal stakeholders."
