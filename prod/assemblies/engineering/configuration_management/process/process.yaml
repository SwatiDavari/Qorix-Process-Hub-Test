# Configuration Management (engineering/configuration_management)  -  process: identity, classification, concepts.
assembly:
  id: configuration_management
  code: cfg
  cluster: engineering
  title: Configuration Management
  enabler: '-'
  scope: GLOB
  layer: '-'
  status: draft
  owner: rl_qx_qa_quality_office
  purpose: Identify, baseline and control configuration items so every release is reproducible.
  standards:
  - ISO 26262-8 cl. 7
  - ASPICE 4.0 SUP.8
  tier: qorix
getting_started: |-
  This describes how to get started with process management at organisation level: where a process comes from, how it is kept in step with the upstream process description it builds on, and who assigns a maturity level to it on what evidence.

  At least once per year the Quality Office reviews the process description against the applicable standards and turns improvement inputs into changes to the process description. The Head of G&C approves a change of maturity level.
concepts: []
outcomes:
- id: oc_qx_cfg_items_controlled
  title: Configuration items are identified and under version control
  status: draft
  statement: Every organisation level work product that projects rely on is identified, has an owner and a version, and is changed only through change management.
  complies: [std_req_aspice_40_sup_8, std_req_iso15288_635]
- id: oc_qx_cfg_baseline_reproducible
  title: Baselines reflect approved changes and can be reproduced
  status: draft
  statement: A baseline contains exactly the configuration item versions that approved changes produced, and the same baseline can be recreated later.
  complies: [std_req_aspice_40_sup_8, std_req_iso15288_635]
capabilities:
- id: cap_qx_cfg_item_identification
  title: Configuration item identification
  status: draft
  description: Decide which work products are configuration items, and record owner, version and location for each.
  realizes: [oc_qx_cfg_items_controlled]
- id: cap_qx_cfg_baseline_management
  title: Baseline management
  status: draft
  description: Freeze a set of configuration item versions into a baseline and keep it reproducible. A release also relies on it.
  realizes: [oc_qx_cfg_baseline_reproducible, oc_qx_rel_release_controlled]
