# Configuration Management (engineering/configuration_management)  -  workflows.
workflows:
- id: wf_qx_cfg_manage_process_description
  title: Manage the Process Description
  status: draft
  responsible: rl_qx_qa_quality_office
  approved_by: rl_qx_gc_head
  supported_by:
  - rl_qx_saf_safety_office
  - rl_qx_sec_security_office
  input:
  - wp_qx_cfg_qms_report
  output:
  - wp_qx_cfg_policies
  description: At least once per year, the Quality Office reviews the process description against the applicable standards, assesses the maturity level of every process area against the criteria, and turns
    improvement inputs into changes to the process description.

- id: wf_qx_cfg_identify_items
  title: Identify Organisation Level Configuration Items
  status: draft
  responsible: rl_qx_qa_quality_office
  approved_by: rl_qx_gc_head
  supported_by:
  - rl_qx_saf_safety_office
  - rl_qx_sec_security_office
  achieves:
  - oc_qx_cfg_items_controlled
  input:
  - wp_qx_cfg_policies
  output:
  - wp_qx_cfg_config_item_list
  description: The Quality Office identifies and lists the organisation level work products that are placed under configuration control, with owner and version. The list is the scope reference for change impact analysis in Change Management.
  activities:
  - step: Decide which organisation level work products are configuration items
    by: rl_qx_qa_quality_office
    capability: cap_qx_cfg_item_identification
  - step: Record owner, version and location for each item
    by: rl_qx_qa_quality_office
  - step: Confirm the list where safety or cybersecurity work products are included
    by: rl_qx_saf_safety_office

- id: wf_qx_cfg_baseline_items
  title: Baseline Organisation Level Configuration Items
  status: draft
  responsible: rl_qx_qa_quality_office
  approved_by: rl_qx_gc_head
  supported_by:
  - rl_qx_saf_safety_office
  - rl_qx_sec_security_office
  input:
  - wp_qx_cm_change_package
  - wp_qx_cfg_config_item_list
  gate:
  - wp: wp_qx_cm_change_package
    min_status: approved
  achieves:
  - oc_qx_cfg_baseline_reproducible
  output:
  - wp_qx_cfg_baseline
  description: After a change package is approved, the Quality Office freezes the affected configuration items into a new baseline. Only a baseline that reflects approved changes can be released.
  activities:
  - step: Collect the approved change package and the configuration item list
    by: rl_qx_qa_quality_office
  - step: Freeze the affected item versions into a new baseline
    by: rl_qx_qa_quality_office
    capability: cap_qx_cfg_baseline_management
  - step: Approve the baseline record
    by: rl_qx_gc_head
