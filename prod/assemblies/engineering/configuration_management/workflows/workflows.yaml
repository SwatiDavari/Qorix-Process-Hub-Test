# Configuration Management (engineering/configuration_management)  -  workflows.
workflows:
- id: wf_qx_cfg_manage_process_description
  title: Manage the Process Description
  status: draft
  responsible: rl_qx_qa_quality_office
  approved_by: rl_qx_gc_head
  supported_by:
  - rl_qx_saf_safety_office
  - rl_qx_sec_security_office
  input:
  - wp_qx_cfg_qms_report
  output:
  - wp_qx_cfg_policies
  description: At least once per year, the Quality Office reviews the process description against the applicable standards, assesses the maturity level of every process area against the criteria, and turns
    improvement inputs into changes to the process description.
