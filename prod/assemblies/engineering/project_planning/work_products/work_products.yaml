# Project Planning and Control (engineering/project_planning)  -  work products.
work_products:
- id: wp_qx_plan_project_brief
  title: "Project Brief"
  kind: plan
  status: draft
  purpose: "Scope statement, constraints and stakeholders from the project's commissioning."
  origin: external
  internal: true
- id: wp_qx_plan_project_plan
  title: "Project Plan"
  kind: plan
  status: draft
  purpose: "Approved plan with scope, schedule, resources, responsibilities and the processes the project applies."
  template: gd_temp_qx_plan_project_plan_template
  complies:
  - std_req_iso15288_631
  - std_req_aspice_40_man_3
- id: wp_qx_plan_status_report
  title: "Project Status Report"
  kind: report
  status: draft
  purpose: "Progress against the plan, deviations, actions and escalations for the review period."
  template: gd_temp_qx_plan_status_template
  complies:
  - std_req_iso15288_632
  - std_req_aspice_40_man_3
