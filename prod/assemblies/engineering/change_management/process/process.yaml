# Change Management (engineering/change_management)  -  process: identity, classification, concepts.
assembly:
  id: change_management
  code: cm
  cluster: engineering
  title: Change Management
  enabler: '-'
  scope: GLOB
  layer: '-'
  status: draft
  owner: rl_qx_cm_change_manager
  group: Control and release
  purpose: Request, analyse, approve and track changes to work products and products.
  standards:
  - ISO 26262-8 cl. 8
  - ASPICE 4.0 SUP.10
  - ISO/IEC/IEEE 15288 6.3.5
  tier: qorix
getting_started: |-
  This describes how to get started with change management at organisation level — how to change something every project applies.

  Decide which of two things you are doing:

  * **Changing a project's own work product** — follows your project's change management plan. Nothing in this area applies.
  * **Changing an organisation level work product** — a policy, management system, plan, register, or role. Every project applies those, so the change must be analysed across all of them before approval.
concepts: []
outcomes:
- id: oc_qx_cm_changes_authorised
  title: Changes are analysed and authorised before they are applied
  status: draft
  statement: Every change to an organisation level work product is analysed for its impact and authorised by the approver the approval authority table names before it is applied.
  complies: [std_req_aspice_40_sup_10, std_req_iso15288_635, std_req_iso15288_633]
- id: oc_qx_cm_changes_traceable
  title: Approved changes are traceable to the items they affect
  status: draft
  statement: Each approved change is recorded in a change package that names the configuration items it affects, so any item can be traced back to the change that produced its current version.
  complies: [std_req_aspice_40_sup_10, std_req_iso15288_635]
capabilities:
- id: cap_qx_cm_impact_analysis
  title: Impact analysis
  status: draft
  description: Establish which work products, projects and disciplines a change reaches, and what each of them must do. Used wherever a change, a risk or a release needs its reach understood.
  realizes: [oc_qx_cm_changes_authorised, oc_qx_cm_changes_traceable]
- id: cap_qx_cm_change_authorisation
  title: Change authorisation
  status: draft
  description: Decide on a change against the approval authority table and record the decision.
  realizes: [oc_qx_cm_changes_authorised]
