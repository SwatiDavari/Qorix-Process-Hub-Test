# Validation (testing/validation)  -  process: identity, classification, concepts.
assembly:
  id: validation
  code: val
  cluster: testing
  title: Validation
  enabler: TST
  scope: GLOB
  layer: '-'
  status: draft
  owner: rl_qx_val_validation_lead
  purpose: |
    Set the organisation-wide test policy, qualify the test systems it relies on, and validate products against stakeholder requirements.
  standards:
  - ISO 26262-4 cl. 8
  - ISO 26262-8 cl. 9
  - ASPICE 4.0 SYS.5 / VAL.1
  tier: qorix
concepts:
- id: doc_concept_qx_val_validation
  title: Validation Concept
  body: |
    The test policy defines what "enough testing" means per ASIL/CAL. Test systems
    (HIL, SIL, target rigs) are configuration items with their own qualification.
    Validation closes the loop from stakeholder requirements to the released product.
outcomes:
- id: oc_qx_val_policy_set
  title: Validation methods and coverage targets are defined before validation starts
  status: draft
  statement: Validation methods and coverage targets are defined for each level of required assurance and aligned with the verification plan before any validation starts.
  complies: [std_req_iso15288_6411]
- id: oc_qx_val_test_systems_qualified
  title: Test systems are qualified before their results are relied on
  status: draft
  statement: Every system used to run validation is specified and qualified for its use before its results are relied on.
  complies: [std_req_iso15288_6411, std_wp_isosae21434_org_management_554]
- id: oc_qx_val_product_validated
  title: A product is validated against its stakeholder requirements and the result is reported
  status: draft
  statement: A product is validated against its stakeholder requirements on qualified test systems, and the result is reported.
  complies: [std_req_iso15288_6411]
capabilities:
- id: cap_qx_val_test_policy_definition
  title: Test policy definition
  status: draft
  description: Derive validation methods and coverage targets for each level of assurance and align them with the verification plan.
  realizes: [oc_qx_val_policy_set]
- id: cap_qx_val_test_system_qualification
  title: Test system qualification
  status: draft
  description: Specify a test system and establish the confidence it deserves for its intended use.
  realizes: [oc_qx_val_test_systems_qualified]
- id: cap_qx_val_validation_execution
  title: Validation execution
  status: draft
  description: Plan validation from stakeholder requirements, run it on qualified test systems and report the result.
  realizes: [oc_qx_val_product_validated]
