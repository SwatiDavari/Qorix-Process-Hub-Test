# Training (organisation/training)  -  process: identity, classification, concepts.
assembly:
  id: training
  code: trn
  cluster: organisation
  title: Training
  enabler: '-'
  scope: GLOB
  layer: '-'
  status: draft
  owner: rl_qx_trn_training_coordinator
  purpose: |
    Make sure every person holding a process role is qualified for it, and keep the evidence (competence matrix, training records) assessor-ready.
  standards:
  - ISO 26262-2 cl. 5.4.5
  - ISO/SAE 21434 cl. 5.4.4
  - ASPICE 4.0 (training material)
  tier: qorix
concepts:
- id: doc_concept_qx_trn_training
  title: Competence Management Concept
  body: |
    Each role has required trainings (`training` needs linked with `qualifies`). The
    competence matrix is generated from those links; records prove completion.
outcomes:
- id: oc_qx_trn_competence_defined
  title: The competence each role needs is defined and recorded
  status: draft
  statement: The competence every role needs is defined, and each person current competence against it is recorded.
  complies: [std_wp_iso26262_management_552, std_wp_isosae21434_org_management_552, std_req_iso15288_624]
- id: oc_qx_trn_training_delivered
  title: Training that closes a competence gap is delivered and recorded
  status: draft
  statement: Training that closes a competence gap is developed, delivered and recorded, and kept current when the organisation process changes.
  complies: [std_wp_iso26262_management_552, std_wp_isosae21434_org_management_552, std_req_aspice_40_iic_06_04, std_req_iso15288_624]
capabilities:
- id: cap_qx_trn_competence_mapping
  title: Competence mapping
  status: draft
  description: Define the competence each role needs and record each person current competence.
  realizes: [oc_qx_trn_competence_defined]
- id: cap_qx_trn_training_delivery
  title: Training delivery
  status: draft
  description: Develop training material from the process, deliver it and record completion.
  realizes: [oc_qx_trn_training_delivered]
