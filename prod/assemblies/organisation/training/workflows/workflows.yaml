# Training (organisation/training)  -  workflows.
workflows:
- id: wf_qx_trn_maintain_competence
  title: Maintain competence matrix
  responsible: rl_qx_trn_training_coordinator
  approved_by: rl_qx_gc_head
  supported_by:
  - rl_qx_gc_process_owner
  input:
  - wp_qx_gc_process_overlay
  - wp_qx_trn_training_path
  output:
  - wp_qx_trn_competence_matrix
  contains:
  - gd_temp_qx_trn_competence_matrix
  has:
  - doc_concept_qx_trn_training
  activities:
  - step: For every role in the resolved process, define required trainings
    by: rl_qx_gc_process_owner
  - step: Generate / update the matrix
    by: rl_qx_trn_training_coordinator
  - step: Approve
    by: rl_qx_gc_head
- id: wf_qx_trn_deliver_training
  title: Develop and deliver training
  responsible: rl_qx_trn_training_coordinator
  approved_by: rl_qx_gc_process_owner
  input:
  - wp_qx_gc_process_overlay
  - wp_qx_trn_competence_matrix
  output:
  - wp_qx_trn_training_material
  - wp_qx_trn_competence_matrix
  activities:
  - step: Update material when the overlay changes
    by: rl_qx_gc_process_owner
  - step: Deliver and record completion
    by: rl_qx_trn_training_coordinator
