relation_types:
  contains:
    forward: contains
    reverse: contained by
  has:
    forward: has
    reverse: relates to
  input:
    forward: needs input
    reverse: is input to
  output:
    forward: outputs
    reverse: is output from
  responsible:
    forward: responsible
    reverse: is responsible for
  approved_by:
    forward: approved by
    reverse: approves
  supported_by:
    forward: supported by
    reverse: supports
  complies:
    forward: complies
    reverse: complies to
  realizes:
    forward: realizes
    reverse: realized by
  realized_by:
    forward: realizes
    reverse: realized by
  parent_needs:
    forward: contained by
    reverse: contains
  affects:
    forward: affects
    reverse: affected by
  derived_from:
    forward: derived from
    reverse: derives
  covers:
    forward: covers
    reverse: covered by
  consists_of:
    forward: consists of
    reverse: forms part of
  belongs_to:
    forward: belongs to
    reverse: has
  satisfied_by:
    forward: satisfied by
    reverse: satisfies
  satisfies:
    forward: satisfies
    reverse: satisfied by
  fulfils:
    forward: fulfils
    reverse: fulfilled by
  implements:
    forward: implements
    reverse: implemented by
  uses:
    forward: uses
    reverse: used by
  provides:
    forward: provides
    reverse: provided by
  includes:
    forward: includes
    reverse: included by
  included_by:
    forward: included by
    reverse: includes
  mitigated_by:
    forward: mitigated_by
    reverse: mitigates
  violates:
    forward: violates
    reverse: violated_by
  fully_verifies:
    forward: fully_verifies
    reverse: fully_verified_by
  partially_verifies:
    forward: partially_verifies
    reverse: partially_verified_by
  evidence:
    forward: evidence
    reverse: evidence_for
rules:
- id: tool_req_docs_common_attr_safety_link_check
  kind: graph
  applies_to:
    types:
    - stkh_req
    - feat_req
    - comp_req
    - aou_req
    - gd_req
    - tool_req
    where: safety == QM
  check:
    quantifier: all
    relation: derived_from
    expect: safety == QM
  explanation: QM requirements cannot be derived from ASIL requirements.
  severity: warning
- id: tool_req_docs_arch_link_qm_to_safety_req
  kind: graph
  applies_to:
    types:
    - feat_arc_sta
    - logic_arc_int
    - logic_arc_int_op
    - comp_arc_sta
    - real_arc_int
    - real_arc_int_op
    where: safety == QM
  check:
    quantifier: all
    relation: fulfils
    expect: safety != QM
  explanation: An QM architecture element cannot implement ASIL requirements.
  severity: warning
- id: tool_req_docs_req_arch_link_safety_to_arch
  kind: graph
  applies_to:
    types:
    - feat_arc_sta
    - logic_arc_int
    - logic_arc_int_op
    - comp_arc_sta
    - real_arc_int
    - real_arc_int_op
    - comp
    - feat
    where:
      and:
      - safety != QM
      - or:
        - status == valid
        - status == valid_inspected
  check:
    quantifier: all
    relation: implements
    expect:
      and:
      - safety != QM
      - or:
        - status == valid
        - status == valid_inspected
  explanation: An safety architecture element can only link other safety architecture elements.
  severity: warning
- id: tool_req_docs_arch_link_security
  kind: graph
  applies_to:
    types:
    - feat_arc_sta
    - logic_arc_int
    - logic_arc_int_op
    - comp_arc_sta
    - real_arc_int
    - real_arc_int_op
    where: security == YES
  check:
    quantifier: all
    relation: implements
    expect: security == YES
  explanation: An security architecture element can only link other security architecture elements.
  severity: warning
- id: workproduct_aspice_40
  kind: graph
  applies_to:
    types:
    - workproduct
    where: complies != []
  check:
    quantifier: all
    relation: complies
    expect:
      or:
      - id contains aspice_40_iic
      - id contains std_wp
  explanation: Workproducts may only link to ASPICE 40 IIC stakeholder requirements. Please ensure that
    the linked requirement is an ASPICE 40 IIC stakeholder requirement.
  severity: warning
lint:
  forbidden_words:
  - id: title_check
    fields:
      title:
      - shall
      - must
      - will
  - id: content_check
    fields:
      content:
      - just
      - about
      - really
      - some
      - thing
      - absolutely
    applies_to_tags:
    - requirement_excl_process
