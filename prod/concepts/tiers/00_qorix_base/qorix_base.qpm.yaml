qpm: '1.0'
tier:
  id: qorix-base
  kind: base
  title: Qorix base process model
  description: Element types, relations and rules every Qorix process builds on. Changed only through the Governance & Compliance overlay workflow.
  owner: Qorix Governance & Compliance
defaults:
  attributes:
    version:
      required: true
      pattern: ^[0-9]+$
    source_code_link:
      required: false
      pattern: ^https://github.com/.*
    testlink:
      required: false
      pattern: ^https://github.com/.*
    bazel_target:
      required: false
      pattern: ^.*$
    bazel_type:
      required: false
      pattern: ^.*$
element_types:
  tsf:
    title: TSF
    prefix: tsf_
    id_parts: 1
    tags: []
    attributes:
      id:
        required: true
        pattern: ^tsf_[0-9a-zA-Z_-]*$
      status:
        required: true
        enum:
        - draft
        - valid
    relations:
      links:
        required: false
        targets:
        - ANY
    presentation:
      color: '#E1D5E7'
  tenet:
    title: Tenet
    prefix: tenet_
    id_parts: 1
    tags: []
    attributes:
      id:
        required: true
        pattern: ^tenet_[0-9a-zA-Z_-]*$
      status:
        required: true
        enum:
        - draft
        - valid
    relations:
      links:
        required: false
        targets:
        - ANY
    presentation:
      color: '#E1D5E7'
  assertion:
    title: Assertion
    prefix: assertion_
    id_parts: 1
    tags: []
    attributes:
      id:
        required: true
        pattern: ^assertion_[0-9a-zA-Z_-]*$
      status:
        required: true
        enum:
        - draft
        - valid
    relations:
      links:
        required: false
        targets:
        - ANY
    presentation:
      color: '#E1D5E7'
  std_req:
    title: Standard Requirement
    prefix: std_req_
    id_parts: 1
    tags: []
    attributes:
      id:
        required: true
        pattern: ^std_req_(iso26262|isosae21434|isopas8926|aspice_40)_[0-9a-zA-Z_-]*$
      status:
        required: true
        enum:
        - valid
    relations:
      links:
        required: false
        targets:
        - ANY
    presentation:
      color: '#E1D5E7'
  std_wp:
    title: Standard Work Product
    prefix: std_wp_
    id_parts: 1
    tags: []
    attributes:
      id:
        required: true
        pattern: ^std_wp_(iso26262|isosae21434|isopas8926|aspice_40)_[0-9a-z_]*$
      status:
        required: true
        enum:
        - valid
    relations: {}
    presentation:
      color: '#E1D5E7'
  workflow:
    title: Workflow
    prefix: wf_
    id_parts: 1
    tags: []
    attributes:
      status:
        required: true
        enum:
        - valid
        - draft
    relations:
      input:
        required: true
        targets:
        - workproduct
      output:
        required: true
        targets:
        - workproduct
      approved_by:
        required: true
        targets:
        - role
      responsible:
        required: true
        targets:
        - role
      supported_by:
        required: false
        targets:
        - role
      contains:
        required: false
        targets:
        - gd_req
        - gd_temp
        - gd_chklst
        - gd_guidl
        - gd_method
      has:
        required: false
        targets:
        - doc_getstrt
        - doc_concept
    presentation:
      color: '#E1D5E7'
  gd_req:
    title: Process Requirements
    prefix: gd_req_
    id_parts: 1
    tags:
    - requirement
    attributes:
      content:
        required: true
        pattern: ^[\s\S]+$
    relations:
      satisfies:
        required: false
        targets:
        - workflow
      complies:
        required: false
        targets:
        - std_req
    presentation:
      color: '#E1D5E7'
  gd_temp:
    title: Process Template
    prefix: gd_temp_
    id_parts: 1
    tags: []
    attributes:
      status:
        required: true
        enum:
        - valid
        - draft
    relations:
      complies:
        required: false
        targets:
        - std_req
    presentation:
      color: '#E1D5E7'
  gd_chklst:
    title: Process Checklist
    prefix: gd_chklst_
    id_parts: 1
    tags: []
    attributes:
      status:
        required: true
        enum:
        - valid
        - draft
    relations:
      complies:
        required: false
        targets:
        - std_req
    presentation:
      color: '#E1D5E7'
  gd_guidl:
    title: Process Guideline
    prefix: gd_guidl_
    id_parts: 1
    tags: []
    attributes:
      status:
        required: true
        enum:
        - valid
        - draft
    relations:
      complies:
        required: false
        targets:
        - std_req
    presentation:
      color: '#E1D5E7'
  gd_method:
    title: Process Method
    prefix: gd_meth_
    id_parts: 1
    tags: []
    attributes:
      status:
        required: true
        enum:
        - valid
        - draft
    relations:
      complies:
        required: false
        targets:
        - std_req
    presentation:
      color: '#E1D5E7'
  workproduct:
    title: Workproduct
    prefix: wp_
    id_parts: 1
    tags: []
    attributes:
      status:
        required: true
        enum:
        - valid
        - draft
    relations:
      complies:
        required: false
        targets:
        - std_wp
        - std_req
    presentation:
      color: '#E1D5E7'
  role:
    title: Role
    prefix: rl_
    id_parts: 1
    tags: []
    attributes: {}
    relations:
      contains:
        required: false
        targets:
        - role
    presentation:
      color: '#E1D5E7'
  doc_concept:
    title: Concept Definition
    prefix: doc_concept_
    id_parts: 1
    tags: []
    attributes:
      status:
        required: true
        enum:
        - valid
        - draft
    relations: {}
  doc_getstrt:
    title: Getting Started
    prefix: doc_getstrt_
    id_parts: 1
    tags: []
    attributes:
      status:
        required: true
        enum:
        - valid
        - draft
    relations: {}
  document:
    title: Generic Document
    prefix: doc_
    id_parts: 1
    tags: []
    attributes:
      status:
        required: true
        enum:
        - valid
        - draft
        - invalid
      safety:
        required: true
        enum:
        - QM
        - ASIL_B
      security:
        required: true
        enum:
        - 'YES'
        - 'NO'
      author:
        required: false
        pattern: ^.*$
      approver:
        required: false
        pattern: ^.*$
      reviewer:
        required: false
        pattern: ^.*$
      report_version:
        required: false
        pattern: ^v(0|[1-9]\d*)\.(0|[1-9]\d*)(\.(0|[1-9]\d*))?$
    relations:
      realizes:
        required: true
        targets:
        - workproduct
  doc_tool:
    title: Tool Verification Report
    prefix: doc_tool_
    id_parts: 1
    tags: []
    attributes:
      status:
        required: true
        enum:
        - draft
        - evaluated
        - qualified
        - released
        - rejected
      security_affected:
        required: true
        enum:
        - 'YES'
        - 'NO'
      safety_affected:
        required: false
        enum:
        - 'YES'
        - 'NO'
      tcl:
        required: false
        enum:
        - LOW
        - HIGH
      author:
        required: false
        pattern: ^.*$
      approver:
        required: false
        pattern: ^.*$
      reviewer:
        required: false
        pattern: ^.*$
      tool_version:
        required: false
        pattern: ^.*$
    relations:
      realizes:
        required: false
        targets:
        - workproduct
  tool_usecase:
    title: Tool Use Case
    prefix: tool_usecase_
    id_parts: 1
    description: 'Defines the usage context in which the tool is evaluated.

      A tool use case does not introduce additional requirements.

      Where applicable, its nested malfunctions provide context for the tool

      requirements relevant to a particular way the project relies on the tool.

      Those tool requirements may satisfy upstream requirements.

      '
    tags: []
    attributes: {}
    relations:
      belongs_to:
        required: true
        targets:
        - doc_tool
    presentation:
      color: '#E1D5E7'
  potential_tool_malfunction:
    title: Potential Tool Malfunction
    prefix: potential_tool_malfunction_
    id_parts: 1
    tags: []
    attributes:
      safety_affected:
        required: true
        enum:
        - 'YES'
        - 'NO'
      detection_sufficient:
        required: false
        enum:
        - 'YES'
        - 'NO'
      safety_measures:
        required: false
        pattern: ^.+$
    relations:
      parent_needs:
        required: true
        targets:
        - tool_usecase
      violates:
        required: true
        targets:
        - tool_req
    presentation:
      color: '#F8CECC'
  stkh_req:
    title: Stakeholder Requirement
    prefix: stkh_req_
    id_parts: 1
    tags:
    - requirement
    - requirement_excl_process
    attributes:
      reqtype:
