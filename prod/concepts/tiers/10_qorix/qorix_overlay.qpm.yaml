# Qorix overlay on top of the Qorix base process model.
#
# Superset rule: an overlay may only ADD or WIDEN. Anything valid against the base
# stays valid here.
qpm: "1.0"
tier:
  id: qorix
  kind: overlay
  extends: qorix-base
  title: Qorix Processes (ASIL B + ASIL D support with CAL 3, ASPICE L3)
  owner: Qorix Governance & Compliance
  description: >
    Adds ASIL D and ISO/SAE 21434 CAL support, the WP purpose/concept/template
    triad, and the G&C, Infrastructure, Validation and Training process areas.

operations:
  # ------------------------------------------------------------ safety (ISO 26262)
  - op: extend_enum
    attribute: safety
    values: [ASIL_A, ASIL_C, ASIL_D]
    rationale: >
      The base model caps safety at ASIL_B. Qorix products (e.g. CP) are developed to ASIL D;
      ASIL_A/ASIL_C are needed as decomposition results (ISO 26262-9 clause 5).

  # ------------------------------------------------------------ security (ISO/SAE 21434)
  - op: extend_element_type
    name: stkh_req
    add_attributes: &cal
      cal:
        required: false
        enum: [CAL1, CAL2, CAL3, CAL4]
        description: Cybersecurity Assurance Level (ISO/SAE 21434 Annex E)
    rationale: The base model lists CAL as TBD; the attribute is optional so existing content stays valid.
  - {op: extend_element_type, name: feat_req, add_attributes: *cal, rationale: "Optional CAL attribute, as for stkh_req."}
  - {op: extend_element_type, name: comp_req, add_attributes: *cal, rationale: "Optional CAL attribute, as for stkh_req."}
  - {op: extend_element_type, name: aou_req, add_attributes: *cal, rationale: "Optional CAL attribute, as for stkh_req."}
  - {op: extend_element_type, name: feat, add_attributes: *cal, rationale: "Optional CAL attribute, as for stkh_req."}
  - {op: extend_element_type, name: comp, add_attributes: *cal, rationale: "Optional CAL attribute, as for stkh_req."}
  - {op: extend_element_type, name: mod, add_attributes: *cal, rationale: "Optional CAL attribute, as for stkh_req."}

  - op: add_rule
    rationale: Every security-relevant item must carry its CAL for 21434 evidence.
    rule:
      id: qx_sec_cal_required
      kind: attribute_required_if
      applies_to:
        types: [stkh_req, feat_req, comp_req, aou_req, feat, comp, mod]
        where: security == YES
      require_attributes: [cal]
      explanation: Security-relevant elements (security == YES) must state a CAL.
      severity: warning

  # ------------------------------------------------------------ ASIL D integrity
  - op: add_rule
    rationale: Flags lower-integrity elements fulfilling ASIL D requirements unless decomposed.
    rule:
      id: qx_arch_asil_d_fulfilment
      kind: graph
      applies_to:
        types: [feat_arc_sta, feat_arc_dyn, logic_arc_int, comp, comp_arc_sta, comp_arc_dyn, real_arc_int]
        where: safety != ASIL_D
      check:
        quantifier: all
        relation: fulfils
        expect: safety != ASIL_D
      explanation: >
        An element below ASIL D fulfils an ASIL D requirement. Document an ASIL
        decomposition (ISO 26262-9 cl. 5) or raise the element ASIL.
      severity: info

  - op: widen_rule
    rule_id: workproduct_aspice_40
    add_alternatives:
      - id contains std_req_iso15288
      - id contains std_req_aspice_40
    rationale: >
      Qorix work products carry `complies` to ISO/IEC/IEEE 15288 clauses and to ASPICE process
      outcomes as well as to ASPICE IIC work product characteristics. The base rule stays valid;
      the overlay only adds these two accepted families.

  - op: extend_element_type
    name: workproduct
    add_attributes:
      kind:
        required: false
        enum: [need, requirement, definition, analysis, plan, request, baseline, report, evidence, policy, rule, material, record, register]
        description: What the work product does for the process, independent of lifecycle model and technology (needs/artifact_kinds.yaml)
    rationale: >
      Classifies every work product by purpose so a process reads the same under any lifecycle model
      or technology. Optional in the metamodel; the hub checker (qpm check-process) requires it.

  # ------------------------------------------------------------ WP triad: purpose / concept / template
  - op: add_relation_type
    name: typed_by
    forward: typed_by
    reverse: types
  - op: extend_element_type
    name: workproduct
    add_relations:
      has: {required: false, targets: [doc_concept]}
      typed_by: {required: false, targets: [gd_temp, gd_chklst]}
    rationale: Each work product links its concept and the template that types it, making WPs self-describing.

  # ------------------------------------------------------------ lifecycle of process elements
  - op: extend_enum
    attribute: status
    types: [workflow, workproduct, gd_temp, doc_concept, doc_getstrt]
    values: [proposed, approved, released, deprecated, retired]
    rationale: Process elements follow the Qorix lifecycle draft -> proposed -> approved -> released -> deprecated -> retired.

  # ------------------------------------------------------------ Governance & Compliance area
  - op: add_relation_type
    name: qualifies
    forward: qualifies
    reverse: qualified by
  - op: add_element_type
    name: gc_finding
    rationale: Audit / assessment findings tracked as traceable needs (ASPICE SUP.1, ISO 26262-2 6.4.9).
    definition:
      title: G&C Finding
      prefix: gc_finding_
      id_parts: 1
      tags: [governance]
      attributes:
        status: {required: true, enum: [open, in_progress, closed, accepted_risk]}
        severity: {required: true, enum: [minor, major, critical]}
        standard: {required: true, enum: [ISO26262, ISOSAE21434, ISOPAS8926, ASPICE40, ISO15288, ISO9001]}
        due: {required: false, pattern: '^\d{4}-\d{2}-\d{2}$'}
        tracking: {required: false, pattern: '^https://.*$'}
      relations:
        affects: {required: true, targets: [ANY]}
        evidence: {required: false, targets: [ANY]}
      presentation: {color: "#F8CECC"}

  # ------------------------------------------------------------ Training area
  - op: add_element_type
    name: training
    rationale: Competence management evidence (ISO 26262-2 5.4.5, ASPICE HR/OPM).
    definition:
      title: Training
      prefix: trn_
      id_parts: 1
      tags: [training]
      attributes:
        status: {required: true, enum: [draft, valid, retired]}
        validity_months: {required: false, pattern: '^[0-9]+$'}
        delivery: {required: false, enum: [self_paced, instructor_led, on_the_job]}
      relations:
        qualifies: {required: true, targets: [role]}
        contains: {required: false, targets: [gd_guidl, gd_temp, gd_chklst]}
      presentation: {color: "#DAE8FC"}

  # ------------------------------------------------------------ outcomes, capabilities (technology-neutral conformance spine)
  - op: add_relation_type
    name: achieves
    forward: achieves
    reverse: achieved by
  # `realizes` already exists in the base (tool realizes work product); capability reuses it.
  - op: add_relation_type
    name: exercises
    forward: exercises
    reverse: exercised by
  - op: add_element_type
    name: outcome
    rationale: >
      A process outcome in Qorix's own technology- and domain-neutral wording. Standards attach to it
      through `complies`, so conformance to ISO/IEC/IEEE 15288, ASPICE or others is claimed per outcome
      and a non-automotive project can drop the automotive clauses without touching the outcome.
    definition:
      title: Outcome
      prefix: oc_
      id_parts: 1
      tags: []
      attributes:
        status: {required: true, enum: [valid, draft, proposed, approved, released, deprecated, retired]}
      relations:
        complies: {required: false, targets: [std_wp, std_req]}
      presentation: {color: "#EADFFD"}
  - op: add_element_type
    name: capability
    rationale: >
      A reusable ability (for example impact analysis) that realizes one or more outcomes and is
      exercised by workflow activities at any scope. Naming it lets a lower-scope process reuse the
      capability of the process above it and lets competence be mapped to it.
    definition:
      title: Capability
      prefix: cap_
      id_parts: 1
      tags: []
      attributes:
        status: {required: true, enum: [valid, draft, proposed, approved, released, deprecated, retired]}
      relations:
        realizes: {required: true, targets: [outcome]}
      presentation: {color: "#DCE8FB"}
  - op: extend_element_type
    name: workflow
    add_relations:
      achieves: {required: false, targets: [outcome]}
      exercises: {required: false, targets: [capability]}
    rationale: A workflow achieves outcomes and exercises capabilities through its activities.

  # ------------------------------------------------------------ objectives, policies (top of the digital thread)
  - op: add_relation_type
    name: drives
    forward: drives
    reverse: driven by
  - op: add_relation_type
    name: contributes_to
    forward: contributes to
    reverse: receives contribution from
  - op: add_element_type
    name: policy
    rationale: >
      An organisation level policy: the why behind a discipline's detailed requirements. It names the
      standard clauses it rests on through `complies` and drives the outcomes of the processes that carry
      it out, so a policy is traceable down to workflows and up to the objectives that drive it.
    definition:
      title: Policy
      prefix: pol_
      id_parts: 1
      tags: []
      attributes:
        status: {required: true, enum: [valid, draft, proposed, approved, released, deprecated, retired]}
      relations:
        complies: {required: false, targets: [std_wp, std_req]}
        drives: {required: false, targets: [outcome]}
      presentation: {color: "#FFE6CC"}
  - op: add_element_type
    name: objective
    rationale: >
      A business objective in technology neutral wording. It drives policies and sits at the top of the
      chain objective, policy, process, outcome, capability, work product. A project objective
      contributes to an organisation objective.
    definition:
      title: Objective
      prefix: obj_
      id_parts: 1
      tags: []
      attributes:
        status: {required: true, enum: [valid, draft, proposed, approved, released, deprecated, retired]}
      relations:
        drives: {required: false, targets: [policy]}
        contributes_to: {required: false, targets: [objective]}
      presentation: {color: "#FFF2CC"}
