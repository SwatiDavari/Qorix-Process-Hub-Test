# Qorix KPI register: a KPI is a measurable statement about an outcome (formula, unit, goal, limit, owner).
# The hub defines each KPI once, at organisation level. Projects measure it and report the value; no values are stored here.
# A KPI hangs under one outcome (measures), so it joins the thread objective, policy, outcome, workflow, work product.
# Source: Qorix_KPI_Parameters.xlsx v2.0.0 (67 rows, 12 duplicates merged into `levels`). owner = process owner of the assembly (to confirm).
