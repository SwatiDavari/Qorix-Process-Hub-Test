name: Framework CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qpm:
    name: Model, catalog and generated-content checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/qpm/requirements_lock.txt
      - name: Self-tests (round trip, tiering rules, catalog)
        run: python -m pytest tools/qpm/tests -q
      - name: Regenerate and fail on drift
        run: |
          bash tools/regen.sh
          git diff --exit-code -- docs upstream || (echo "::error::Generated content out of date - run tools/regen.sh"; exit 1)

  docs:
    name: Sphinx-needs build (score_docs_as_code)
    needs: qpm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Graphviz (needed by PlantUML)
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - run: bazel test //tools/qpm:qpm_test
      - name: docs_check
        run: |
          set -o pipefail
          bazel run //:docs_check 2>&1 | tee /tmp/docs.log || {
            grep -E "WARNING|ERROR" /tmp/docs.log | sed 's/^/::error::/'
            exit 1
          }
      - name: docs
        run: |
          set -o pipefail
          bazel run //:docs 2>&1 | tee /tmp/docs_html.log || {
            grep -E "WARNING|ERROR" /tmp/docs_html.log | sed 's/^/::error::/'
            exit 1
          }
      - name: Locate HTML output
        run: |
          top=$(find _build -maxdepth 3 -name index.html -printf '%d %p\n' | sort -n | head -1 | cut -d' ' -f2)
          dir=$(dirname "$top")
          echo "Publishing $dir"
          # Guard: never publish a sub-folder or an unstyled site
          grep -q "<title>Qorix Process Framework" "$top" || { echo "::error::$top is not the site home page"; exit 1; }
          ls "$dir"/_static/*.css >/dev/null 2>&1 || { echo "::error::no stylesheets in $dir/_static"; exit 1; }
          test -f "$dir/process_description/index.html" || { echo "::error::Process Description page missing"; exit 1; }
          echo "HTML_DIR=$dir" >> "$GITHUB_ENV"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.HTML_DIR }}

  deploy:
    name: Publish to GitHub Pages
    needs: docs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
