graph_checks:
  tool_req__docs_common_attr_safety_link_check:
    needs:
      include: stkh_req, feat_req, comp_req, aou_req, gd_req, tool_req
      condition: safety == QM
    check_all:
      derived_from: safety == QM
    explanation: QM requirements cannot be derived from ASIL requirements.
  tool_req__docs_arch_link_qm_to_safety_req:
    needs:
      include: feat_arc_sta, logic_arc_int, logic_arc_int_op, comp_arc_sta, real_arc_int, real_arc_int_op
      condition: safety == QM
    check_all:
      fulfils: safety != QM
    explanation: An QM architecture element cannot implement ASIL requirements.
  tool_req__docs_req_arch_link_safety_to_arch:
    needs:
      include: feat_arc_sta, logic_arc_int, logic_arc_int_op, comp_arc_sta, real_arc_int, real_arc_int_op,
        comp, feat
      condition:
        and:
        - safety != QM
        - or:
          - status == valid
          - status == valid_inspected
    check_all:
      implements:
        and:
        - safety != QM
        - or:
          - status == valid
          - status == valid_inspected
    explanation: An safety architecture element can only link other safety architecture elements.
  tool_req__docs_arch_link_security:
    needs:
      include: feat_arc_sta, logic_arc_int, logic_arc_int_op, comp_arc_sta, real_arc_int, real_arc_int_op
      condition: security == YES
    check_all:
      implements: security == YES
    explanation: An security architecture element can only link other security architecture elements.
  workproduct_aspice_40:
    needs:
      include: workproduct
      condition: complies != []
    check_all:
      complies:
        or:
        - id contains aspice_40__iic
        - id contains std_wp
    explanation: Workproducts may only link to ASPICE 40 IIC stakeholder requirements. Please ensure that
      the linked requirement is an ASPICE 40 IIC stakeholder requirement.
  qx__arch_asil_d_fulfilment:
    needs:
      include: feat_arc_sta, feat_arc_dyn, logic_arc_int, comp, comp_arc_sta, comp_arc_dyn, real_arc_int
      condition: safety != ASIL_D
    check_all:
      fulfils: safety != ASIL_D
    explanation: 'An element below ASIL D fulfils an ASIL D requirement. Document an ASIL decomposition
      (ISO 26262-9 cl. 5) or raise the element ASIL.

      '
    info_only: true
