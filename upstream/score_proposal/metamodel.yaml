needs_types_base_options:
  optional_options:
    source_code_link: ^https://github.com/.*
    testlink: ^https://github.com/.*
    bazel_target: ^.*$
    bazel_type: ^.*$
  mandatory_options:
    version: ^[0-9]+$
prohibited_words_checks:
  title_check:
    title:
    - shall
    - must
    - will
  content_check:
    types:
    - requirement_excl_process
    content:
    - just
    - about
    - really
    - some
    - thing
    - absolutely
needs_types:
  tsf:
    title: TSF
    color: '#E1D5E7'
    mandatory_options:
      id: ^tsf__[0-9a-zA-Z_-]*$
      status: ^(draft|valid)$
    optional_links:
      links: ANY
    parts: 3
  tenet:
    title: Tenet
    color: '#E1D5E7'
    mandatory_options:
      id: ^tenet__[0-9a-zA-Z_-]*$
      status: ^(draft|valid)$
    optional_links:
      links: ANY
    parts: 3
  assertion:
    title: Assertion
    color: '#E1D5E7'
    mandatory_options:
      id: ^assertion__[0-9a-zA-Z_-]*$
      status: ^(draft|valid)$
    optional_links:
      links: ANY
    parts: 3
  std_req:
    title: Standard Requirement
    color: '#E1D5E7'
    mandatory_options:
      id: ^std_req__(iso26262|isosae21434|isopas8926|aspice_40)__[0-9a-zA-Z_-]*$
      status: ^(valid)$
    optional_links:
      links: ANY
    parts: 3
  std_wp:
    title: Standard Work Product
    color: '#E1D5E7'
    mandatory_options:
      id: ^std_wp__(iso26262|isosae21434|isopas8926|aspice_40)__[0-9a-z_]*$
      status: ^(valid)$
    parts: 3
  workflow:
    title: Workflow
    color: '#E1D5E7'
    prefix: wf__
    mandatory_options:
      status: ^(valid|draft)$
    mandatory_links:
      input: workproduct
      output: workproduct
      approved_by: role
      responsible: role
    optional_links:
      supported_by: role
      contains: gd_req, gd_temp, gd_chklst, gd_guidl, gd_method
      has: doc_getstrt, doc_concept
    parts: 2
  gd_req:
    title: Process Requirements
    color: '#E1D5E7'
    mandatory_options:
      content: ^[\s\S]+$
    optional_links:
      satisfies: workflow
      complies: std_req
    tags:
    - requirement
    parts: 2
  gd_temp:
    title: Process Template
    color: '#E1D5E7'
    mandatory_options:
      status: ^(valid|draft)$
    optional_links:
      complies: std_req
    parts: 2
  gd_chklst:
    title: Process Checklist
    color: '#E1D5E7'
    mandatory_options:
      status: ^(valid|draft)$
    optional_links:
      complies: std_req
    parts: 2
  gd_guidl:
    title: Process Guideline
    color: '#E1D5E7'
    mandatory_options:
      status: ^(valid|draft)$
    optional_links:
      complies: std_req
    parts: 2
  gd_method:
    title: Process Method
    color: '#E1D5E7'
    prefix: gd_meth__
    mandatory_options:
      status: ^(valid|draft)$
    optional_links:
      complies: std_req
    parts: 2
  workproduct:
    title: Workproduct
    color: '#E1D5E7'
    prefix: wp__
    mandatory_options:
      status: ^(valid|draft)$
    optional_links:
      complies: std_wp, std_req
      has: doc_concept
      contains: gd_temp, gd_chklst
    parts: 2
  role:
    title: Role
    color: '#E1D5E7'
    prefix: rl__
    optional_links:
      contains: role
    parts: 2
  doc_concept:
    title: Concept Definition
    mandatory_options:
      status: ^(valid|draft)$
    parts: 2
  doc_getstrt:
    title: Getting Started
    mandatory_options:
      status: ^(valid|draft)$
    parts: 2
  document:
    title: Generic Document
    prefix: doc__
    mandatory_options:
      status: ^(valid|draft|invalid)$
      safety: ^(QM|ASIL_A|ASIL_B|ASIL_C|ASIL_D)$
      security: ^(YES|NO)$
    optional_options:
      author: ^.*$
      approver: ^.*$
      reviewer: ^.*$
      report_version: ^v(0|[1-9]\d*)\.(0|[1-9]\d*)(\.(0|[1-9]\d*))?$
    mandatory_links:
      realizes: workproduct
    parts: 2
  doc_tool:
    title: Tool Verification Report
    mandatory_options:
      status: ^(draft|evaluated|qualified|released|rejected)$
      security_affected: ^(YES|NO)$
    optional_options:
      safety_affected: ^(YES|NO)$
      tcl: ^(LOW|HIGH)$
      author: ^.*$
      approver: ^.*$
      reviewer: ^.*$
      tool_version: ^.*$
    optional_links:
      realizes: workproduct
    parts: 2
  tool_usecase:
    title: Tool Use Case
    description: 'Defines the usage context in which the tool is evaluated.

      A tool use case does not introduce additional requirements.

      Where applicable, its nested malfunctions provide context for the tool

      requirements relevant to a particular way the project relies on the tool.

      Those tool requirements may satisfy upstream requirements.

      '
    color: '#E1D5E7'
    mandatory_links:
      belongs_to: doc_tool
    parts: 3
  potential_tool_malfunction:
    title: Potential Tool Malfunction
    color: '#F8CECC'
    mandatory_options:
      safety_affected: ^(YES|NO)$
    optional_options:
      detection_sufficient: ^(YES|NO)$
      safety_measures: ^.+$
    mandatory_links:
      parent_needs: tool_usecase
      violates: tool_req
    parts: 3
  stkh_req:
    title: Stakeholder Requirement
    color: '#DAE8FC'
    mandatory_options:
      reqtype: ^(Functional|Interface|Process|Non-Functional)$
      safety: ^(QM|ASIL_A|ASIL_B|ASIL_C|ASIL_D)$
      status: ^(valid|invalid|valid_inspected)$
      rationale: ^.+$
      security: ^(YES|NO)$
      valid_from: ^v(0|[1-9]\d*)\.(0|[1-9]\d*)(\.(0|[1-9]\d*))?$
    optional_options:
      testcovered: ^(YES|NO)$
      hash: ^.*$
      valid_until: ^v(0|[1-9]\d*)\.(0|[1-9]\d*)(\.(0|[1-9]\d*))?$
      cal: ^(CAL1|CAL2|CAL3|CAL4)$
    tags:
    - requirement
    - requirement_excl_process
    parts: 3
  feat_req:
    title: Feature Requirement
    color: '#FFF2CC'
    style: node
    mandatory_options:
      reqtype: ^(Functional|Interface|Process|Non-Functional)$
      security: ^(YES|NO)$
      safety: ^(QM|ASIL_A|ASIL_B|ASIL_C|ASIL_D)$
      status: ^(valid|invalid|valid_inspected)$
      content: ^[\s\S]+$
      valid_from: ^v(0|[1-9]\d*)\.(0|[1-9]\d*)(\.(0|[1-9]\d*))?$
    optional_options:
      testcovered: ^(YES|NO)$
      hash: ^.*$
      valid_until: ^v(0|[1-9]\d*)\.(0|[1-9]\d*)(\.(0|[1-9]\d*))?$
      cal: ^(CAL1|CAL2|CAL3|CAL4)$
    mandatory_links:
      satisfied_by: feat
    optional_links:
      derived_from: stkh_req
      covers: aou_req
    tags:
    - requirement
    - requirement_excl_process
    parts: 3
  comp_req:
    title: Component Requirement
    color: '#D5E8D4'
    mandatory_options:
      reqtype: ^(Functional|Interface|Process|Non-Functional)$
      security: ^(YES|NO)$
      safety: ^(QM|ASIL_A|ASIL_B|ASIL_C|ASIL_D)$
      status: ^(valid|invalid|valid_inspected)$
      content: ^[\s\S]+$
    optional_options:
      testcovered: ^(YES|NO)$
      hash: ^.*$
      cal: ^(CAL1|CAL2|CAL3|CAL4)$
    mandatory_links:
      satisfied_by: comp
    optional_links:
      derived_from: feat_req
      covers: aou_req
    tags:
    - requirement
    - requirement_excl_process
    parts: 3
  tool_req:
    title: Tool Requirement
    color: '#F5F5F5'
    mandatory_options:
      content: ^[\s\S]+$
    optional_options:
      tags: ^.*$
      testcovered: ^(YES|NO)$
      hash: ^.*$
      implemented: ^(YES|PARTIAL|NO)$
      parent_covered: ^.*$
      parent_has_problem: ^.*$
      security: ^(YES|NO)$
      safety: ^(QM|ASIL_A|ASIL_B|ASIL_C|ASIL_D)$
    mandatory_links:
      satisfies: gd_req, stkh_req, feat_req, comp_req
    tags:
    - requirement
    - requirement_excl_process
    parts: 2
  aou_req:
    title: Assumption of Use Requirement
    color: '#FCFCFC'
    mandatory_options:
      reqtype: ^(Functional|Interface|Process|Non-Functional)$
      security: ^(YES|NO)$
      safety: ^(QM|ASIL_A|ASIL_B|ASIL_C|ASIL_D)$
      status: ^(valid|invalid|valid_inspected)$
      content: ^[\s\S]+$
    optional_options:
      testcovered: ^(YES|NO)$
      hash: ^.*$
      cal: ^(CAL1|CAL2|CAL3|CAL4)$
    tags:
    - requirement
    - requirement_excl_process
    parts: 3
  feat:
    title: Feature
    color: '#FFF2CC'
    style: card
    mandatory_options:
      security: ^(YES|NO)$
      safety: ^(QM|ASIL_A|ASIL_B|ASIL_C|ASIL_D)$
      status: ^(valid|invalid|valid_inspected)$
    optional_options:
      cal: ^(CAL1|CAL2|CAL3|CAL4)$
    optional_links:
      includes: logic_arc_int, logic_arc_int_op
      uses: logic_arc_int, logic_arc_int_op
      provides: logic_arc_int, logic_arc_int_op
    tags:
    - architecture_element
    parts: 2
  feat_arc_sta:
    title: Feature & Feature Package Diagram
    color: '#FFF2CC'
    style: card
    mandatory_options:
      security: ^(YES|NO)$
      safety: ^(QM|ASIL_A|ASIL_B|ASIL_C|ASIL_D)$
      status: ^(valid|invalid|valid_inspected)$
    mandatory_links:
      includes: logic_arc_int, logic_arc_int_op
      belongs_to: feat
    optional_links:
      fulfils: feat_req, aou_req
    tags:
    - architecture_element
    - architecture_view
    parts: 3
  feat_arc_dyn:
    title: Feature Sequence Diagram
    color: '#FFF2CC'
    style: card
    mandatory_options:
      security: ^(YES|NO)$
      safety: ^(QM|ASIL_A|ASIL_B|ASIL_C|ASIL_D)$
      status: ^(valid|invalid|valid_inspected)$
    mandatory_links:
      belongs_to: feat
    optional_links:
      fulfils: feat_req
    tags:
    - architecture_view
    - architecture_element
    parts: 3
  logic_arc_int:
    title: Logical Interface & Feature Interface View
    color: '#FFF2CC'
    style: card
    mandatory_options:
      security: ^(YES|NO)$
      safety: ^(QM|ASIL_A|ASIL_B|ASIL_C|ASIL_D)$
      status: ^(valid|invalid|valid_inspected)$
    optional_links:
      included_by: feat
      fulfils: feat_req
    tags:
    - architecture_element
    - architecture_view
    parts: 3
  logic_arc_int_op:
    title: Logical Interface Operation
    color: '#FFF2CC'
    style: card
    mandatory_options:
      security: ^(YES|NO)$
      safety: ^(QM|ASIL_A|ASIL_B|ASIL_C|ASIL_D)$
      status: ^(valid|invalid|valid_inspected)$
    mandatory_links:
      included_by: logic_arc_int
    tags:
    - architecture_element
    parts: 3
  mod:
    title: Module
    color: '#D5E8D4'
    style: card
    optional_options:
      security: ^(YES|NO)$
      safety: ^(QM|ASIL_A|ASIL_B|ASIL_C|ASIL_D)$
      status: ^(valid|invalid|valid_inspected)$
      maturity: ^(preview|experimental|release)$
      cal: ^(CAL1|CAL2|CAL3|CAL4)$
    mandatory_links:
      includes: comp
    tags:
    - architecture_element
    parts: 2
  mod_view_sta:
    title: Module Architecture Static View
    color: '#D5E8D4'
    style: card
    optional_links:
      belongs_to: mod
      includes: comp
    tags:
    - architecture_view
    parts: 3
  mod_view_dyn:
    title: Module Architecture Dynamic View
    color: '#D5E8D4'
    style: card
    optional_links:
      belongs_to: mod
    parts: 3
  comp:
    title: Component
    color: '#D5E8D4'
    style: card
    mandatory_options:
      security: ^(YES|NO)$
      safety: ^(QM|ASIL_A|ASIL_B|ASIL_C|ASIL_D)$
      status: ^(valid|invalid|valid_inspected)$
    optional_options:
      cal: ^(CAL1|CAL2|CAL3|CAL4)$
    mandatory_links:
      belongs_to: feat
    optional_links:
      implements: logic_arc_int, real_arc_int_op
      uses: logic_arc_int, real_arc_int_op
      consists_of: comp
      fulfils: aou_req
    tags:
    - architecture_element
    parts: 2
  comp_arc_sta:
    title: Component Package Diagram
    color: '#D5E8D4'
    style: card
    mandatory_options:
      security: ^(YES|NO)$
      safety: ^(QM|ASIL_A|ASIL_B|ASIL_C|ASIL_D)$
      status: ^(valid|invalid|valid_inspected)$
    mandatory_links:
      belongs_to: comp
    optional_links:
      uses: logic_arc_int, real_arc_int_op
      fulfils: comp_req
    tags:
    - architecture_view
    parts: 3
  comp_arc_dyn:
    title: Component Sequence Diagram
    color: '#D5E8D4'
    style: card
    mandatory_options:
      security: ^(YES|NO)$
      safety: ^(QM|ASIL_A|ASIL_B|ASIL_C|ASIL_D)$
      status: ^(valid|invalid|valid_inspected)$
    mandatory_links:
      belongs_to: comp
    optional_links:
      fulfils: comp_req
    tags:
    - architecture_view
    parts: 3
  real_arc_int:
    title: Interface & Component Interface
    color: '#D5E8D4'
    style: card
    mandatory_options:
      security: ^(YES|NO)$
      safety: ^(QM|ASIL_A|ASIL_B|ASIL_C|ASIL_D)$
      status: ^(valid|invalid|valid_inspected)$
      language: ^(cpp|rust)$
    optional_links:
      fulfils: comp_req
    tags:
    - architecture_element
    - architecture_view
    parts: 3
  real_arc_int_op:
    title: Interface Operation
    color: '#D5E8D4'
    style: card
    mandatory_options:
      security: ^(YES|NO)$
      safety: ^(QM|ASIL_A|ASIL_B|ASIL_C|ASIL_D)$
      status: ^(valid|invalid|valid_inspected)$
    mandatory_links:
      included_by: real_arc_int
    optional_links:
      implements: logic_arc_int_op
    tags:
    - architecture_element
    parts: 3
  review_header:
    title: Review Header
    mandatory_options:
      reviewers: ^.+$
      approvers: ^.+$
      hash: ^.+$
      template: ^.+$
    parts: 3
  plat_saf_dfa:
    title: Platform Dependent Failure Analysis
    color: '#DAE8FC'
    mandatory_options:
      failure_id: ^.+$
      failure_effect: ^.+$
      sufficient: ^(yes|no)$
      status: ^(valid|invalid)$
      content: ^[\s\S]+$
    optional_options:
      safety_relevant: ^(yes|no)$
      mitigation_issue: ^https://github\.com/[^/]+/[^/]+/issues/\d+$
    mandatory_links:
      violates: feat_arc_sta
    optional_links:
      mitigated_by: stkh_req, aou_req
    parts: 3
  feat_saf_dfa:
    title: Feature DFA (Dependent Failure Analysis)
    color: '#FFF2CC'
    mandatory_options:
      failure_id: ^.+$
      failure_effect: ^.+$
      sufficient: ^(yes|no)$
      status: ^(valid|invalid)$
      content: ^[\s\S]+$
    optional_options:
      safety_relevant: ^(yes|no)$
      mitigation_issue: ^https://github\.com/[^/]+/[^/]+/issues/\d+$
    mandatory_links:
      violates: feat_arc_sta
    optional_links:
      mitigated_by: feat_req, aou_req
    tags:
    - dependent_failure_analysis
    - safety_analysis
    parts: 3
  comp_saf_dfa:
    title: Component DFA (Dependent Failure Analysis)
    color: '#D5E8D4'
    mandatory_options:
      failure_id: ^.+$
      failure_effect: ^.+$
      sufficient: ^(yes|no)$
      status: ^(valid|invalid)$
      content: ^[\s\S]+$
    optional_options:
      safety_relevant: ^(yes|no)$
      mitigation_issue: ^https://github\.com/[^/]+/[^/]+/issues/\d+$
    mandatory_links:
      violates: comp_arc_sta
    optional_links:
      mitigated_by: comp_req, aou_req
    tags:
    - dependent_failure_analysis
    - safety_analysis
    parts: 3
  feat_saf_fmea:
    title: Feature FMEA (Failure Mode and Effects Analysis)
    color: '#FFF2CC'
    mandatory_options:
      fault_id: ^.+$
      failure_effect: ^.+$
      sufficient: ^(yes|no)$
      status: ^(valid|invalid)$
      content: ^[\s\S]+$
    optional_options:
      safety_relevant: ^(yes|no)$
      failure_root_cause: ^[\s\S]+$
      mitigation_issue: ^https://github\.com/[^/]+/[^/]+/issues/\d+$
    mandatory_links:
      violates: feat_arc_dyn, feat_arc_sta
    optional_links:
      mitigated_by: feat_req, aou_req
    tags:
    - failure_mode_effects_analysis
    - safety_analysis
    parts: 3
  comp_saf_fmea:
    title: Component FMEA (Failure Mode and Effects Analysis)
    color: '#D5E8D4'
    mandatory_options:
      fault_id: ^.+$
      failure_effect: ^.+$
      sufficient: ^(yes|no)$
      status: ^(valid|invalid)$
      content: ^[\s\S]+$
    optional_options:
      safety_relevant: ^(yes|no)$
      failure_root_cause: ^[\s\S]+$
      mitigation_issue: ^https://github\.com/[^/]+/[^/]+/issues/\d+$
    mandatory_links:
      violates: comp_arc_dyn, comp_arc_sta
    optional_links:
      mitigated_by: comp_req, aou_req
    tags:
    - failure_mode_effects_analysis
    - safety_analysis
    parts: 3
  feat_sec_threat:
    title: Feature Security Analysis Threat (STRIDE)
    color: '#FFF2CC'
    mandatory_options:
      threat_id: ^(AU_01_0[1-3]|AZ_01_0[1-3]|CT_01_0[1-2]|DS_01_0[1-3]|EX_01_0[1-6]|LA_01_0[1-3]|MT_01_0[1-7])$
      status: ^(valid|invalid)$
      content: ^[\s\S]+$
    tags:
    - stride_threat
    - security_analysis
    parts: 3
  comp_sec_threat:
    title: Component Security Analysis Threat (STRIDE)
    color: '#D5E8D4'
    mandatory_options:
      threat_id: ^(AU_01_0[1-3]|AZ_01_0[1-3]|CT_01_0[1-2]|DS_01_0[1-3]|EX_01_0[1-6]|LA_01_0[1-3]|MT_01_0[1-7])$
      status: ^(valid|invalid)$
      content: ^[\s\S]+$
    tags:
    - stride_threat
    - security_analysis
    parts: 3
  plat_sec_threat:
    title: Platform Security Analysis Threat (STRIDE)
    color: '#DAE8FC'
    mandatory_options:
      threat_id: ^(AU_01_0[1-3]|AZ_01_0[1-3]|CT_01_0[1-2]|DS_01_0[1-3]|EX_01_0[1-6]|LA_01_0[1-3]|MT_01_0[1-7])$
      status: ^(valid|invalid)$
      content: ^[\s\S]+$
    tags:
    - stride_threat
    - security_analysis
    parts: 3
  feat_sec_ana:
    title: Feature Security Analysis (Threat Scenario)
    color: '#FFF2CC'
    mandatory_options:
      threat_scenario_id: ^(AS_01_(01|02|04|05|06|07|09|10)|CO_01_0[1-7]|SC_01_0[2-5]|SI_01_0[2-5]|UI_01_(0[1-9]|1[0-2]))$
      status: ^(valid|invalid)$
      sufficient: ^(yes|no)$
      threat_effect: ^.+$
      content: ^[\s\S]+$
    optional_options:
      mitigation_issue: ^https://github\.com/[^/]+/[^/]+/issues/\d+$
    optional_links:
      mitigated_by: feat_req, aou_req
    tags:
    - threat_scenario
    - security_analysis
    parts: 3
  comp_sec_ana:
    title: Component Security Analysis (Threat Scenario)
    color: '#D5E8D4'
    mandatory_options:
      threat_scenario_id: ^(AS_01_(01|02|04|05|06|07|09|10)|CO_01_0[1-7]|SC_01_0[2-5]|SI_01_0[2-5]|UI_01_(0[1-9]|1[0-2]))$
      status: ^(valid|invalid)$
      sufficient: ^(yes|no)$
      threat_effect: ^.+$
      content: ^[\s\S]+$
    optional_options:
      mitigation_issue: ^https://github\.com/[^/]+/[^/]+/issues/\d+$
    optional_links:
      mitigated_by: comp_req, aou_req
    tags:
    - threat_scenario
    - security_analysis
    parts: 3
  plat_sec_ana:
    title: Platform Security Analysis (Threat Scenario)
    color: '#DAE8FC'
    mandatory_options:
      threat_scenario_id: ^(AS_01_(01|02|04|05|06|07|09|10)|CO_01_0[1-7]|SC_01_0[2-5]|SI_01_0[2-5]|UI_01_(0[1-9]|1[0-2]))$
      status: ^(valid|invalid)$
      sufficient: ^(yes|no)$
      threat_effect: ^.+$
      content: ^[\s\S]+$
    optional_options:
      mitigation_issue: ^https://github\.com/[^/]+/[^/]+/issues/\d+$
    optional_links:
      mitigated_by: feat_req, aou_req
    tags:
    - threat_scenario
    - security_analysis
    parts: 3
  testcase:
    title: Testcase Needs parsed from test.xml files
    optional_options:
      name: ^.*$
      file: ^.*$
      line: ^.*$
      test_type: ^.*$
      derivation_technique: ^.*$
      result: ^.*$
      result_text: ^.*$
    optional_links:
      fully_verifies: ANY
      partially_verifies: ANY
  mod_ver_report:
    title: Module Verification Report
    prefix: mod_vrep__
    mandatory_options:
      safety: ^(QM|ASIL_A|ASIL_B|ASIL_C|ASIL_D)$
      security: ^(YES|NO)$
      status: ^(valid|invalid)$
      verification_method: ^.+$
    optional_options:
      requirements_tests_completely_passed_percent: ^(100|[1-9]?[0-9])$
      line_coverage_percent: ^(100|[1-9]?[0-9])$
      branch_coverage_percent: ^(100|[1-9]?[0-9])$
      applies_to_module_version: ^.*$
    mandatory_links:
      belongs_to: mod
    optional_links:
      contains: ANY
      evidence: ANY
      covers: ANY
      realizes: workproduct
    tags:
    - verification_report
    parts: 3
  dec_rec:
    title: Decision Record
    mandatory_options:
      status: ^(proposed|accepted|deprecated|rejected|superseded)$
      context: ^.+$
      decision: ^.+$
